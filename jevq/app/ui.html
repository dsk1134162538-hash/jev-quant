<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Jev 模拟盘</title>
<style>
  /* ---- 令牌：浅色为默认，深色跟随系统；文字色都满足 4.5:1 ---- */
  :root {
    color-scheme: light dark;
    --bg:#f3f5f9; --bg-2:#eaeef4; --card:#ffffff; --tile:#f2f4f8; --line:#e2e7ef; --line-strong:#cbd3df;
    --text:#131c2b; --text-2:#3f4b60; --muted:#5d6a82;
    --accent:#2455d6; --on-accent:#ffffff;
    --up:#c9302c; --down:#0b7d45; --warn:#a15c00;
    --board-accent:#d97706; --board-shadow:#0d9488; --rebound-accent:#db2777; --rebound-shadow:#4d7c0f;
    --shadow-pop:0 12px 32px rgba(19,28,43,.16), 0 2px 6px rgba(19,28,43,.08); --pop-ring:transparent;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0e131a; --bg-2:#121922; --card:#161d27; --tile:#1d2531; --line:#263040; --line-strong:#364358;
      --text:#e8edf5; --text-2:#b8c2d3; --muted:#8b97ac;
      --accent:#7ea2ff; --on-accent:#0b1220;
      --up:#ff7468; --down:#41d48f; --warn:#f2b04a;
      --board-accent:#f5a83c; --board-shadow:#2dd4bf; --rebound-accent:#f472b6; --rebound-shadow:#a3e635;
      --shadow-pop:0 14px 36px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4); --pop-ring:var(--line-strong);
    }
  }
  * { box-sizing:border-box; scrollbar-width:thin; scrollbar-color:var(--line-strong) transparent; }
  ::selection { background:color-mix(in srgb, var(--accent) 28%, transparent); }
  html { accent-color:var(--accent); }
  body { margin:0; font:14px/1.55 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
         background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
  h1, h2, h3, h4 { text-wrap:balance; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .ic { width:14px; height:14px; flex:none; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; vertical-align:-2px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }

  /* ---- 顶栏 ---- */
  header { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px; flex-wrap:wrap; min-height:60px; padding:10px 24px;
           background:var(--card); border-bottom:1px solid var(--line); }
  @media (max-width: 1100px) { header { position:static; } .rule-aside { top:10px; } }   /* 窄窗口顶栏会换行变高，不再固定，省出竖向空间 */
  .brand { display:flex; align-items:center; gap:10px; margin-right:6px; }
  .brand .logo { width:30px; height:30px; flex:none; }
  .logo rect { fill:var(--accent); } .logo path { fill:none; stroke:var(--on-accent); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; } .logo circle { fill:var(--on-accent); }
  header h1 { font-size:16px; font-weight:600; letter-spacing:.01em; margin:0; white-space:nowrap; }
  .hstat { display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-width:0; }
  .hactions { display:flex; gap:8px; margin-left:auto; }
  .chip { display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 11px; border-radius:999px; background:var(--tile);
          color:var(--text-2); font-size:12.5px; white-space:nowrap; max-width:100%; }
  .chip .k { color:var(--muted); }
  .chip b { color:var(--text); font-weight:600; overflow:hidden; text-overflow:ellipsis; }
  .chip:has(.dot.on) { background:color-mix(in srgb, var(--down) 11%, var(--card)); color:var(--down); }
  .chip:has(.dot.on) #phase { font-weight:600; }
  .chip.warn { background:color-mix(in srgb, var(--warn) 11%, var(--card)); color:var(--warn); }
  .chip.warn b { color:inherit; }
  .chip.info { background:color-mix(in srgb, var(--accent) 10%, var(--card)); color:var(--accent); }
  .chip.info b { color:inherit; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); display:inline-block; flex:none; }
  .dot.on { background:var(--down); }
  .tag { color:var(--muted); }
  .tag b { color:var(--text); font-weight:600; }
  .spacer { flex:1; }

  /* ---- 控件 ---- */
  button { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line-strong); min-height:32px; padding:0 14px;
           border-radius:8px; cursor:pointer; transition:background-color .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease); }
  /* 通用按钮的悬停/按下用 :where 压到最低优先级，各种变体（标签、分段、方块……）自己的底色不会被悬停盖掉 */
  button:where(:hover:not(:disabled)) { background:var(--tile); border-color:color-mix(in srgb, var(--muted) 55%, var(--line-strong)); }
  button:where(:active:not(:disabled)) { background:color-mix(in srgb, var(--tile) 70%, var(--line-strong)); }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:500; }
  button.primary:where(:hover:not(:disabled)) { background:color-mix(in srgb, var(--accent) 86%, #000); border-color:color-mix(in srgb, var(--accent) 86%, #000); }
  button.primary:where(:active:not(:disabled)) { background:color-mix(in srgb, var(--accent) 76%, #000); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  input, select { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line-strong); border-radius:8px; height:32px; padding:0 10px;
                  caret-color:var(--accent); transition:border-color .15s var(--ease), box-shadow .15s var(--ease); }
  input:hover:not(:disabled), select:hover:not(:disabled) { border-color:color-mix(in srgb, var(--muted) 55%, var(--line-strong)); }
  input:focus-visible, select:focus-visible { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  input:disabled { background:var(--tile); color:var(--muted); }
  input[type=checkbox] { width:16px; height:16px; padding:0; vertical-align:-3px; }

  /* ---- 页面骨架与卡片 ---- */
  main { max-width:1480px; margin:0 auto; padding:24px 24px 56px; display:grid; gap:20px; }
  .strategy-title { display:flex; align-items:center; gap:12px; font-size:13px; font-weight:600; color:var(--text-2); margin:0 0 10px; }
  .strategy-title::after { content:""; flex:1; height:1px; background:var(--line); }
  .cards { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:16px; margin-bottom:22px; }
  .cards:last-child { margin-bottom:0; }
  @media (max-width: 980px) { .cards { grid-template-columns:minmax(0, 1fr); } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; }
  .card h2 { font-size:15px; font-weight:600; margin:0; color:var(--text); }
  .card-head { display:flex; align-items:center; justify-content:space-between; gap:8px 16px; flex-wrap:wrap; margin-bottom:8px; }
  .acct-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
  .acct-head h2 { display:flex; align-items:center; gap:9px; min-width:0; }
  .big { font-size:30px; line-height:1.15; font-weight:600; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  .acct-sub { display:flex; flex-wrap:wrap; gap:2px 16px; margin-top:6px; color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
  .acct-sub b { color:var(--text-2); font-weight:500; }
  .up { color:var(--up); } .down { color:var(--down); }
  .pill { display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 10px; border-radius:999px; flex:none;
          font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; background:var(--tile); color:var(--muted); }
  .pill.up { color:var(--up); background:color-mix(in srgb, var(--up) 8%, var(--card)); }
  .pill.down { color:var(--down); background:color-mix(in srgb, var(--down) 8%, var(--card)); }
  .pill.up::before, .pill.down::before { content:""; width:8px; height:7px; background:currentColor; }
  .pill.up::before { clip-path:polygon(50% 0, 100% 100%, 0 100%); }
  .pill.down::before { clip-path:polygon(0 0, 100% 0, 50% 100%); }

  /* ---- 表格 ---- */
  .table-wrap { overflow-x:auto; max-width:100%; }
  .acct .table-wrap { margin-top:14px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:13px; }
  th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td.wrap { white-space:normal; }
  th { color:var(--muted); font-weight:500; font-size:12px; border-bottom-color:var(--line-strong); }
  th.num, td.num { text-align:right; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:color-mix(in srgb, var(--accent) 5%, transparent); }
  .acct th:first-child, .acct td:first-child { padding-left:0; }
  .acct th:last-child, .acct td:last-child { padding-right:0; }
  .acct .empty { padding:18px 0 4px; text-align:left; }
  .empty { color:var(--muted); padding:36px 12px; text-align:center; }

  /* ---- 标签页 ---- */
  .tabs { display:flex; gap:2px; border-bottom:1px solid var(--line); margin:-6px 0 16px; flex-wrap:wrap; }
  .tabs button { position:relative; border:none; border-radius:0; background:none; color:var(--muted); min-height:42px; padding:0 14px; font-weight:500; }
  .tabs button:hover:not(:disabled) { color:var(--text); }
  .tabs button.active { color:var(--accent); }
  .tabs button.active::after { content:""; position:absolute; left:10px; right:10px; bottom:-1px; height:2px; border-radius:2px 2px 0 0; background:var(--accent); }
  #tabBody .muted { color:var(--muted); font-size:13px; margin:2px 0 10px; }
  #tabBody .own-sec { border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin:8px 0; }
  #tabBody .own-sec > summary { cursor:pointer; }
  #tabBody .own-prop { margin:6px 0; }
  #tabBody h3 { font-size:14px; font-weight:600; margin:18px 0 8px; }
  #tabBody .tabs { border-bottom:none; gap:6px; margin:0 0 14px; }
  #tabBody .tabs button { min-height:30px; padding:0 13px; border:1px solid var(--line); border-radius:999px; font-size:13px; font-weight:400; color:var(--text-2); }
  #tabBody .tabs button:hover:not(:disabled):not(.active) { background:var(--tile); }
  #tabBody .tabs button.active { background:color-mix(in srgb, var(--accent) 10%, var(--card)); border-color:color-mix(in srgb, var(--accent) 40%, var(--line)); color:var(--accent); }
  #tabBody .tabs button.active::after { display:none; }

  /* ---- 净值曲线 ---- */
  #curve svg { width:100%; height:100%; display:block; overflow:visible; }
  .chart { position:relative; height:260px; padding:8px 0 28px 54px; }
  .chart .plot { position:relative; height:100%; cursor:crosshair; }
  .chart .ylab { position:absolute; left:0; width:46px; text-align:right; transform:translateY(-50%);
                 font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .chart .xlab { position:absolute; bottom:-22px; transform:translateX(-50%); font-size:11.5px; color:var(--muted); white-space:nowrap; }
  .chart .grid { stroke:var(--line); stroke-width:1; stroke-dasharray:2 5; }
  .chart .zero { stroke:var(--text-2); stroke-width:1; stroke-opacity:.45; }
  .chart .series polyline { stroke-width:2.25px; }
  .chart .series { transition:opacity .15s; }
  .chart.focus .series { opacity:.15; }
  .chart.focus .series.on { opacity:1; }
  .chart .cross { stroke:var(--muted); stroke-width:1; stroke-dasharray:3 3; }
  .chart .tip { position:absolute; top:4px; z-index:5; pointer-events:none; min-width:250px;
                background:var(--card); border:1px solid var(--pop-ring); border-radius:10px; padding:10px 12px;
                box-shadow:var(--shadow-pop); font-size:12.5px; line-height:1.75; }
  .chart .tip .d { color:var(--muted); margin-bottom:4px; font-weight:500; }
  .chart .tip .row { display:flex; align-items:center; gap:8px; }
  .chart .tip .row .n { flex:1; white-space:nowrap; }
  .chart .tip .row .v { font-variant-numeric:tabular-nums; font-weight:600; }
  .chart .tip .row .e { font-variant-numeric:tabular-nums; color:var(--muted); min-width:70px; text-align:right; }
  .chart + .tag { margin-top:10px; font-size:12px; }
  .chart.mood { height:240px; }
  .chart.mood-bars { height:130px; padding-top:0; }
  .chart .mood-turn { position:absolute; transform:translate(-50%, -100%); font-size:11px; font-weight:700;
    color:var(--warn); pointer-events:none; }
  .mood-head { display:flex; gap:14px; flex-wrap:wrap; align-items:baseline; margin:4px 0 6px; }
  .mood-head b { font-size:15px; }
  .legend { display:flex; flex-wrap:wrap; gap:4px; }
  .legend span { display:inline-flex; align-items:center; height:26px; padding:0 10px; border-radius:999px; color:var(--text-2);
                 font-size:12.5px; white-space:nowrap; transition:background-color .15s var(--ease); }
  .legend span[data-id] { cursor:default; }
  .legend span[data-id]:hover { background:var(--tile); }
  .sw { display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:7px; background:var(--c); }
  .sw.dash { height:0; background:none; border-top:3px dashed var(--c); border-radius:0; }

  /* ---- 复盘报告 / 日志 ---- */
  .layout { display:grid; grid-template-columns:190px minmax(0, 1fr); gap:24px; }
  .report-list { display:flex; flex-direction:column; gap:2px; }
  .report-list button { width:100%; text-align:left; border-color:transparent; background:none; color:var(--text-2); font-variant-numeric:tabular-nums; }
  .report-list button:hover:not(:disabled):not(.on) { background:var(--tile); border-color:transparent; }
  .report-list button.on { background:color-mix(in srgb, var(--accent) 10%, var(--card)); color:var(--accent); font-weight:500; }
  .md { max-width:100%; }
  .md p { margin:6px 0; max-width:78ch; }
  .md code { font:12px "Cascadia Mono", Consolas, monospace; background:var(--tile); padding:1px 5px; border-radius:4px; }
  .md h1 { font-size:20px; margin:4px 0 10px; } .md h2 { font-size:16px; margin:26px 0 8px; } .md h3 { font-size:14px; margin:18px 0 6px; }
  .md h4 { font-size:13px; margin:14px 0 4px; color:var(--muted); }
  .md table { margin:8px 0; }
  .md blockquote { color:var(--muted); margin:10px 0; padding:2px 0 2px 12px; border-left:1px solid var(--line-strong); max-width:78ch; }
  #log { font:12.5px/1.7 "Cascadia Mono", Consolas, monospace; max-height:420px; overflow:auto; white-space:pre-wrap;
         background:var(--tile); color:var(--text-2); border-radius:10px; padding:14px 16px; }

  /* ---- 决策明细 ---- */
  .clickable tr[data-id] { cursor:pointer; }
  .clickable tr[data-id]:hover td { background:color-mix(in srgb, var(--accent) 7%, transparent); }
  .clickable tr.sel td { background:color-mix(in srgb, var(--accent) 11%, transparent); }
  .clickable td .ic { color:var(--muted); }
  .detail { background:var(--tile); border-radius:12px; padding:14px 18px; margin-bottom:14px; }
  .detail h3 { margin:0 0 6px; font-size:15px; }
  .detail h4 { margin:14px 0 4px; font-size:13px; color:var(--muted); font-weight:500; }
  .detail ul { margin:4px 0; padding-left:18px; }
  .detail tr:hover td { background:color-mix(in srgb, var(--text) 4%, transparent); }
  .kv span { margin-right:14px; }
  .risk-bar { display:inline-flex; width:60px; height:6px; border-radius:3px; overflow:hidden; background:var(--line);
              vertical-align:middle; margin-right:6px; }
  .risk-bar i { display:block; height:100%; }
  .risk-bar .h { background:var(--up); } .risk-bar .m { background:var(--warn); }
  .risk-bar .l { background:color-mix(in srgb, var(--muted) 55%, transparent); }
  .risk-probs { font-size:12px; color:var(--muted); }
  .risk-hi { color:var(--up); } .risk-mid { color:var(--warn); }
  b.risk-hi, b.risk-mid { display:inline-block; padding:0 8px; border-radius:999px; font-size:12px; font-weight:600; line-height:20px; }
  b.risk-hi { background:color-mix(in srgb, var(--up) 10%, var(--tile)); }
  b.risk-mid { background:color-mix(in srgb, var(--warn) 12%, var(--tile)); }
  .risk-excerpt summary { cursor:pointer; color:var(--accent); font-size:12px; }
  .risk-excerpt div { color:var(--muted); font-size:12px; margin-top:2px; max-width:560px; }

  /* ---- 规则页 ---- */
  .rules-layout { display:grid; grid-template-columns:200px minmax(0, 1fr) 340px; gap:24px; align-items:start; }
  @media (max-width: 1150px) {
    .rules-layout { grid-template-columns:180px minmax(0, 1fr); }
    .rule-aside { grid-column:2; }
  }
  @media (max-width: 820px) {
    .rules-layout, .layout { grid-template-columns:minmax(0, 1fr); }
    .rule-aside { grid-column:1; }
  }
  .rule-list { display:flex; flex-direction:column; gap:4px; }
  .rule-list .rl-title { font-size:12px; color:var(--muted); margin:14px 0 2px; padding:0 4px; }
  .rl-item { text-align:left; padding:8px 12px; display:flex; flex-direction:column; align-items:flex-start; gap:3px; border-color:transparent; background:none; }
  .rl-item:hover:not(:disabled):not(.active) { background:var(--tile); border-color:transparent; }
  .rl-item b { font-weight:600; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rl-item .rl-meta { font-size:12px; color:var(--muted); }
  .rl-item.active { border-color:color-mix(in srgb, var(--accent) 38%, var(--line)); background:color-mix(in srgb, var(--accent) 9%, var(--card)); }
  .rl-item.active b { color:var(--accent); }
  .badge { display:inline-block; font-size:11.5px; line-height:18px; padding:0 8px; border-radius:999px; background:var(--tile); color:var(--muted); }
  .badge.on { color:var(--down); background:color-mix(in srgb, var(--down) 10%, var(--card)); }
  .badge.pending { color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, var(--card)); }
  .badge.off { color:var(--muted); }
  .rule-head { display:flex; align-items:center; gap:8px 10px; flex-wrap:wrap; margin-bottom:14px; }
  .rule-head .rh-title { font-size:18px; font-weight:600; }
  button.danger { background:var(--up); border-color:var(--up); color:#fff; }
  button.danger:hover:not(:disabled) { background:color-mix(in srgb, var(--up) 88%, #000); border-color:color-mix(in srgb, var(--up) 88%, #000); }
  button.link { border:none; background:none; color:var(--up); padding:0 6px; }
  button.link:hover:not(:disabled) { text-decoration:underline; }
  button.icon { min-height:28px; padding:0 8px; display:inline-flex; align-items:center; justify-content:center; }
  .form-grid { display:flex; flex-wrap:wrap; gap:10px 20px; align-items:center; padding:14px 16px; background:var(--tile); border-radius:12px; margin-bottom:18px; }
  .form-grid .lbl { color:var(--muted); margin-right:8px; }
  .form-grid input[type=number] { width:110px; }
  .form-grid #rName { width:180px; }
  .form-grid label { white-space:nowrap; }
  .form-grid select { margin-right:4px; }
  .wall-area { margin-bottom:22px; }
  .wall-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .wall-head h3 { font-size:15px; font-weight:600; margin:0; }
  .seg { display:inline-flex; gap:2px; padding:2px; border-radius:9px; background:var(--tile); border:1px solid var(--line); }
  .seg button { border:none; border-radius:7px; min-height:26px; padding:0 11px; font-size:12.5px; background:none; color:var(--muted); }
  .seg button:hover:not(:disabled) { color:var(--text); }
  .seg button.on { background:var(--card); color:var(--accent); font-weight:500; box-shadow:0 1px 2px rgba(19,28,43,.12); }
  .wall-group { margin-top:12px; }
  .wall-group .g-title { font-size:12px; color:var(--muted); margin-bottom:6px; }
  .wall-grid { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; }
  @media (max-width: 1000px) { .wall-grid { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
  .tile { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:0 12px; border-radius:8px;
          border:1px solid transparent; background:var(--tile); color:var(--text-2); text-align:left; min-height:38px; }
  .tile:hover:not(:disabled) { border-color:color-mix(in srgb, var(--accent) 45%, transparent); }
  .tile .t-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tile .t-val { font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:600; color:var(--muted); }
  .tile.on { background:color-mix(in srgb, var(--accent) 11%, var(--card)); border-color:color-mix(in srgb, var(--accent) 55%, transparent); color:var(--text); }
  .tile.on .t-val { color:var(--accent); }
  .tile.editing { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); color:var(--text); }
  .exit-rule { background:var(--tile); border-radius:12px; padding:10px 12px; margin-bottom:10px; }
  .exit-rule .tile { background:var(--card); }
  .exit-rule .tile.on { background:color-mix(in srgb, var(--accent) 11%, var(--card)); }
  .exit-rule .seg { background:var(--card); }
  .exit-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .exit-no { font-weight:600; color:var(--muted); min-width:14px; text-align:center; }
  .exit-name { width:170px; }
  .exit-sum { margin-top:8px; cursor:pointer; color:var(--text-2); }
  .rule-pop { position:absolute; z-index:50; width:310px; background:var(--card); border:1px solid var(--pop-ring); border-radius:12px;
              padding:12px 14px; box-shadow:var(--shadow-pop); }
  .rule-pop .pop-title { display:flex; align-items:center; gap:6px; font-weight:600; margin-bottom:10px; }
  .rule-pop .pop-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .rule-pop input[type=number] { width:96px; }
  .rule-pop .pop-actions { display:flex; align-items:center; gap:6px; margin-top:6px; }
  .rule-pop .chk { margin-right:8px; white-space:nowrap; }
  .rule-aside { display:flex; flex-direction:column; gap:12px; position:sticky; top:76px; }
  .aside-card { background:var(--tile); border-radius:12px; padding:14px 16px; }
  .aside-card h4 { margin:0 0 8px; font-size:13px; font-weight:600; }
  .chk-box { padding:8px 12px; border-radius:8px; margin-bottom:6px; }
  .chk-box ul { margin:4px 0 0; padding-left:18px; }
  .chk-box.err { background:color-mix(in srgb, var(--up) 10%, var(--card)); color:var(--up); }
  .chk-box.warn { background:color-mix(in srgb, var(--warn) 12%, var(--card)); color:var(--warn); }
  .chk-box.ok { background:color-mix(in srgb, var(--down) 10%, var(--card)); color:var(--down); }
  .chk-box.pending { color:var(--muted); background:var(--card); }
  .hit { margin:4px 0 10px; }
  .hit .big-num { font-size:24px; font-weight:600; color:var(--accent); font-variant-numeric:tabular-nums; }
  .err-text { color:var(--up); }
  .notice { margin-top:8px; }
  .notice.ok { color:var(--down); } .notice.err { color:var(--up); }
  button.wide { width:100%; }
  .preview { margin-top:10px; max-height:420px; overflow:auto; }
  .preview th { white-space:normal; line-height:1.3; vertical-align:bottom; }
  .preview th:nth-child(-n+2), .preview td:nth-child(-n+2) { position:sticky; background:var(--tile); z-index:1; }
  .preview th:nth-child(1), .preview td:nth-child(1) { left:0; min-width:28px; }
  .preview th:nth-child(2), .preview td:nth-child(2) { left:28px; }
  .builtin-sec { max-width:78ch; }
  .builtin-sec h4 { margin:20px 0 6px; font-size:13px; color:var(--text); font-weight:600; }
  .builtin-sec ul { margin:0; padding:0; list-style:none; }
  .builtin-sec li { position:relative; padding-left:16px; margin:5px 0; }
  .builtin-sec li::before { content:""; position:absolute; left:3px; top:.72em; width:5px; height:5px; border-radius:50%; background:var(--line-strong); }
  .history { margin-bottom:14px; }

  /* ---- 知识库 ---- */
  .kb-head { display:flex; align-items:center; gap:10px 18px; flex-wrap:wrap; margin-bottom:18px; }
  .kb-head .tag { font-size:12.5px; }
  .kb-head a, .kb-src { color:var(--accent); text-decoration:none; text-underline-offset:3px; }
  .kb-head a:hover, .kb-src:hover { text-decoration:underline; }
  .kb-search { position:relative; display:inline-flex; align-items:center; }
  .kb-search .ic { position:absolute; left:10px; color:var(--muted); pointer-events:none; }
  .kb-search input { width:300px; max-width:100%; padding-left:32px; }
  .kb-search input::placeholder { color:var(--muted); }
  .kb-layout { grid-template-columns:224px minmax(0, 1fr); }
  #kbNav { position:sticky; top:76px; align-self:start; }
  #kbNav button { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .kb-nav-title { font-size:12px; color:var(--muted); margin:14px 0 2px; padding:0 14px; }
  .kb-nav-title:first-child { margin-top:0; }
  .kb-n { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  @media (max-width: 1100px) { #kbNav { top:10px; } }
  @media (max-width: 820px) { #kbNav { position:static; } .kb-layout { grid-template-columns:minmax(0, 1fr); } }
  .kb-read h3 { font-size:18px; font-weight:600; margin:0 0 6px; }
  .kb-intro { color:var(--text-2); margin:0 0 2px; }
  .kb-read .tag { font-size:12.5px; margin:0; }
  .kb-read .builtin-sec, .kb-art-body.builtin-sec { max-width:none; }   /* 用户要求：窗口放大时正文跟着铺满，不限行宽 */
  .kb-read .builtin-sec h4 { margin:28px 0 8px; font-size:14px; }
  .kb-read .builtin-sec li { margin:9px 0; line-height:1.72; }
  .kb-read .builtin-sec li::before { top:.8em; }
  .kb-refs { white-space:nowrap; margin-left:5px; }
  button.kb-ref { min-width:20px; min-height:20px; height:20px; padding:0 5px; margin-left:3px; border-radius:999px; border-color:var(--line);
                  font-size:11px; line-height:18px; color:var(--muted); vertical-align:1px; font-variant-numeric:tabular-nums; }
  button.kb-ref:hover { color:var(--accent); border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); background:color-mix(in srgb, var(--accent) 8%, var(--card)); }
  .kb-count { font-size:12.5px; margin:0 0 6px; }
  .kb-art { border-bottom:1px solid var(--line); }
  .kb-art summary { display:flex; align-items:center; gap:10px; padding:9px 6px; border-radius:8px; cursor:pointer; list-style:none; }
  .kb-art summary::-webkit-details-marker { display:none; }
  .kb-art summary:hover { background:color-mix(in srgb, var(--accent) 5%, transparent); }
  .kb-art summary .ic { color:var(--muted); transition:transform .18s var(--ease); }
  .kb-art[open] summary .ic { transform:rotate(90deg); }
  .kb-art[open] summary .kb-title { color:var(--accent); }
  .kb-date { flex:none; font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .kb-title { flex:1; min-width:0; font-weight:500; }
  .kb-art summary .badge { flex:none; }
  .kb-art-body { padding:0 6px 14px 30px; }
  .kb-art-body li { line-height:1.7; }
  .kb-art-body p { margin:4px 0; }
  .kb-src { display:inline-flex; align-items:center; gap:5px; margin-top:8px; font-size:13px; }
  button.kb-link { border:none; background:none; min-height:0; padding:0; color:var(--accent); text-align:left; }
  button.kb-link:hover { background:none; text-decoration:underline; text-underline-offset:3px; }
  mark { background:color-mix(in srgb, var(--warn) 24%, transparent); color:inherit; border-radius:3px; padding:0 1px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-info" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25"/><path d="M8 7.2v3.6M8 5.1v.1"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="M3.5 8.4l3 3 6-6.6"/></symbol>
  <symbol id="i-chev-right" viewBox="0 0 16 16"><path d="M6 3.5l4.5 4.5L6 12.5"/></symbol>
  <symbol id="i-chev-down" viewBox="0 0 16 16"><path d="M3.5 6l4.5 4.5L12.5 6"/></symbol>
  <symbol id="i-arrow-up" viewBox="0 0 16 16"><path d="M8 13V3.5M4 7.5l4-4 4 4"/></symbol>
  <symbol id="i-arrow-down" viewBox="0 0 16 16"><path d="M8 3v9.5M4 8.5l4 4 4-4"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.25"/><path d="M10.2 10.2l3.3 3.3"/></symbol>
  <symbol id="i-link" viewBox="0 0 16 16"><path d="M9.5 3h3.5v3.5M13 3L7.5 8.5M11.5 9.5v3h-8v-8h3"/></symbol>
</svg>
<header>
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M7 21l5.5-6 4 3.5L25 9"/><circle cx="25" cy="9" r="2.3"/></svg>
    <h1>Jev 模拟盘</h1>
  </div>
  <div class="hstat">
    <span class="chip"><span id="dot" class="dot"></span><span id="phase">未运行</span></span>
    <span class="chip"><span class="k">外围</span><b id="overseas">–</b></span>
    <span class="chip"><span class="k">情绪</span><b id="sentiment">–</b></span>
    <span class="chip warn" id="warningWrap" style="display:none"><svg class="ic"><use href="#i-info"/></svg><b id="warning"></b></span>
    <span class="chip" id="watchWrap" style="display:none"><span class="k">观察池</span><b id="boardWatch"></b></span>
    <span class="chip info" id="daemonWrap" style="display:none"><svg class="ic"><use href="#i-info"/></svg><b id="daemonMsg"></b></span>
  </div>
  <div class="hactions">
    <button id="btnStart" class="primary">开始运行</button>
    <button id="btnStop" disabled>停止</button>
  </div>
</header>
<main>
  <section id="accounts"></section>
  <section class="card" id="curve">
    <div class="card-head"><h2>净值曲线</h2><div class="legend" id="curveLegend"></div></div>
    <div id="curveBody"></div>
  </section>
  <section class="card">
    <div class="tabs" id="mainTabs">
      <button data-tab="fills" class="active">今日成交</button>
      <button data-tab="candidates">候选</button>
      <button data-tab="mood">情绪</button>
      <button data-tab="decisions">Jev 判断</button>
      <button data-tab="own">自建板块</button>
      <button data-tab="board">封板统计</button>
      <button data-tab="rules">规则</button>
      <button data-tab="reports">复盘报告</button>
      <button data-tab="knowledge">知识库</button>
      <button data-tab="logs">运行日志</button>
    </div>
    <div id="tabBody"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n, d = 2) => n == null ? "–" : Number(n).toLocaleString("zh-CN", {minimumFractionDigits:d, maximumFractionDigits:d});
const signCls = (n) => n > 0 ? "up" : n < 0 ? "down" : "";
const ic = (name) => `<svg class="ic" aria-hidden="true"><use href="#i-${name}"/></svg>`;     // 顶部 <svg> 里的图标精灵
let api, tab = "fills", today = "";
let selectedId = null;
let strategyFilter = null;
let noticesExpanded = false;

// ---- 账户颜色与名称：内置四个固定色，自定义策略按 c{n} 的序号分配颜色，影子账户用虚线 ----
const BUILTIN_ORDER = ["board_main", "board_shadow", "rebound_main", "rebound_shadow"];
const BUILTIN_COLORS = {board_main: "var(--board-accent)", board_shadow: "var(--board-shadow)",
  rebound_main: "var(--rebound-accent)", rebound_shadow: "var(--rebound-shadow)"};
const PALETTE = ["#e8590c", "#0ea5e9", "#c026d3", "#65a30d", "#e11d48", "#0d9488", "#7c3aed", "#ca8a04"];
const CUSTOM_ACCOUNT = /^c(\d+)_(main|shadow)$/;
const CUSTOM_ID = /^c\d+$/;
let accountMeta = {};   // 账户 id → {name, baseline, strategy, strategyName}（来自最近一次 status）
let ruleNames = {};     // 自定义策略 id → 名称（来自 rules_list）

function accountColor(id) {
  if (BUILTIN_COLORS[id]) return BUILTIN_COLORS[id];
  const m = CUSTOM_ACCOUNT.exec(id || "");
  return m ? PALETTE[(Number(m[1]) - 1) % PALETTE.length] : "var(--muted)";
}
const isDashed = (id) => /_shadow$/.test(id || "");     // 所有影子账户都用虚线：主/影子净值重合时（首板两个账户成交一样）实线主账户不会被盖住
const swatch = (id) => `<i class="sw${isDashed(id) ? " dash" : ""}" style="--c:${accountColor(id)}"></i>`;
function accountName(id) {
  if (accountMeta[id]) return accountMeta[id].name;
  const m = CUSTOM_ACCOUNT.exec(id || "");
  if (m && ruleNames["c" + m[1]]) return `${ruleNames["c" + m[1]]}·${m[2] === "main" ? "主(Jev)" : "影子"}`;
  return id;
}
function accountSortKey(id) {
  const b = BUILTIN_ORDER.indexOf(id);
  if (b >= 0) return [0, b, 0];
  const m = CUSTOM_ACCOUNT.exec(id);
  return m ? [1, Number(m[1]), m[2] === "main" ? 0 : 1] : [2, 0, 0];
}
function sortAccounts(ids) {
  return [...ids].sort((a, b) => {
    const ka = accountSortKey(a), kb = accountSortKey(b);
    for (let i = 0; i < 3; i++) if (ka[i] !== kb[i]) return ka[i] - kb[i];
    return a < b ? -1 : a > b ? 1 : 0;
  });
}

// 整列都是数字/百分比/占位符的列右对齐，方便上下比大小
const NUM_CELL = /^(?:<span[^>]*>)?[+-]?[\d,]+(?:\.\d+)?%?(?:<\/span>)?$|^–$/;
const ID_HEADER = /^(?:代码|#)?$/;        // 股票代码、序号是标识，不是数量：保持左对齐
function table(headers, rows, wrapCols) {
  if (!rows.length) return '<div class="empty">暂无数据</div>';
  const wrap = wrapCols || [headers.length - 1];
  const num = headers.map((h, i) => !ID_HEADER.test(String(h).replace(/<[^>]*>/g, "").trim())
    && rows.every((r) => NUM_CELL.test(String(r[i] ?? "").trim())));
  return `<div class="table-wrap"><table><tr>${headers.map((h, i) => `<th${num[i] ? ' class="num"' : ""}>${h}</th>`).join("")}</tr>${rows.map((r) =>
    `<tr>${r.map((c, i) => `<td class="${[wrap.includes(i) ? "wrap" : "", num[i] ? "num" : ""].filter(Boolean).join(" ")}">${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
}

// 「候选」页：后台每分钟写的快照，两张表都已按优先顺序排好；字符串一律 esc
const CAND_VERDICT = {pass: "已通过", reject: "否决", error: "出错", skip: "跳过"};
function candVerdict(v, why) {
  const label = CAND_VERDICT[v];
  return label ? `<span title="${esc(why || "")}">${esc(label)}</span>` : "未判";
}
function candidatesHtml(d) {
  d = d || {};
  if (!d.date) return '<div class="empty">还没有候选快照，后台开盘后每分钟生成一次</div>';
  const pct = (v) => v == null ? "–" : `<span class="${signCls(v)}">${v > 0 ? "+" : ""}${fmt(v)}%</span>`;
  const board = d.board || [];
  const rb = d.rebound;
  let html = `<div class="muted">数据日期 ${esc(d.date)}　更新于 ${esc(d.updated || "–")}（只读，按买入优先顺序排列，不影响买卖）</div>`;
  html += "<h3>扫首板 · 观察池</h3>" + (board.length ? table(["#", "代码", "名称", "题材", "热度", "涨幅", "现价", "文章点名", "Jev"],
    board.map((r) => [esc(r.rank), esc(r.code), esc(r.name), esc(r.concept), esc(r.heat), pct(r.pct), fmt(r.price),
      r.article_hot ? esc(r.article_hot) : "–", candVerdict(r.verdict, r.why)]), [3, 7])
    : '<div class="empty">观察池为空（开盘后涨幅进入热门题材的首板才会进来）</div>');
  html += "<h3>超跌反弹 · 入选名单</h3>";
  if (!rb) return html + '<div class="empty">超跌反弹未运行</div>';
  const mode = rb.mode === "none" ? "偏弱/冰点/未知，不买" : rb.mode === "turn" ? "情绪拐点，盘中抄底" : rb.mode === "tail" ? "偏弱/冰点/未知，只在尾盘买" : "盘中可买";
  html += `<div class="muted">情绪 ${esc(rb.sentiment || "未知")}（${esc(mode)}）；${rb.window_open ? "现在在买入时段内" : "现在不在买入时段"}${rb.enabled ? "" : "；今天只卖不买"}${rb.total > (rb.items || []).length ? `；共 ${esc(rb.total)} 只，只列前 ${esc((rb.items || []).length)} 只` : ""}</div>`;
  html += (rb.items || []).length ? table(["#", "代码", "名称", "涨幅", "现价", "近5日", "缩量天数", "Jev"],
    rb.items.map((r) => [esc(r.rank), esc(r.code), esc(r.name), pct(r.pct), fmt(r.price), pct(r.ret5),
      r.shrink_days == null ? "–" : esc(r.shrink_days), candVerdict(r.verdict, r.why)]), [7])
    : '<div class="empty">此刻没有满足条件的票（09:45 前折算不了缩量，不入选）</div>';
  return html;
}

// 「自建板块」页（只记录，不参与交易）：按主营收入占比自己划的板块；确认/驳回只改自建板块自己的表
const OWN_TIER = {core: "核心", related: "相关"};
const OWN_STATUS = {auto: "自动", confirmed: "已确认", pending: "待确认", rejected: "已驳回"};
function ownBasis(m) {
  const b = m.basis || {};
  if (b.source === "主营构成") {
    const items = (b.products || []).slice(0, 4).map((p) => `${p.name} ${fmt((p.ratio || 0) * 100, 1)}%`).join("；");
    return `主营构成 ${b.period || ""}：${items}`;
  }
  if (b.source === "主营介绍") {
    const j = b.jev || {};
    return `主营介绍：${(b.intro && b.intro["主营业务"]) || ""}；Jev 判「${j.choice || "?"}」`;
  }
  return "";
}
function ownMemberRow(sid, m) {
  const acts = m.status === "pending" || m.status === "auto"
    ? `<button data-own-review="confirm" data-sector="${esc(sid)}" data-code="${esc(m.code)}">确认</button> `
      + `<button data-own-review="reject" data-sector="${esc(sid)}" data-code="${esc(m.code)}">驳回</button>` : "";
  return [esc(m.code), esc((m.basis && m.basis.name) || ""), esc(OWN_TIER[m.tier] || m.tier),
    m.share == null ? "–" : fmt(m.share * 100, 1) + "%", esc(OWN_STATUS[m.status] || m.status),
    esc(ownBasis(m)), esc(String(m.valid_to || "").slice(5)), acts];
}
function ownSectorHtml(s) {
  const d = s.daily || {}, leaders = d.leaders || [];
  const head = `<summary><b>${esc(s.name)}</b>　${d.jev_strength ? "Jev " + esc(d.jev_strength) : "未判"}　成员 ${esc(d.members ?? s.members.filter((m) => m.tier === "core" && (m.status === "auto" || m.status === "confirmed")).length)}`
    + `　强势 ${esc(d.strong ?? "–")}　涨停 ${esc(d.limit_up ?? "–")}`
    + `　龙头 ${esc(leaders.slice(0, 3).map((l) => l.name || l.code).join("、") || "–")}`
    + `${d.article_mentioned ? "　晚报点名" : ""}</summary>`;
  const lead = leaders.length ? table(["#", "代码", "名称", "涨幅", "占比", "连板", "名次和"],
    leaders.map((l) => [esc(l.rank), esc(l.code), esc(l.name), (l.pct == null ? "–" : fmt(l.pct) + "%"),
      l.share == null ? "–" : fmt(l.share * 100, 1) + "%", esc(l.board), esc(l.score)])) : "";
  const mem = s.members.length ? table(["代码", "公司", "层级", "占比", "状态", "依据", "有效至", "操作"],
    s.members.map((m) => ownMemberRow(s.id, m)), [5, 7]) : '<div class="empty">暂无成员（收盘后刷新）</div>';
  const intra = (s.intraday || []).map((x) => `${esc(x.time)} ${esc(x.jev_strength || "未判")}`
    + (x.avg_pct == null ? "" : `（${fmt(x.avg_pct)}%）`)).join("　");
  return `<details class="own-sec">${head}<div class="muted">${esc(s.product_def)}</div>`
    + (intra ? `<div class="muted">盘中情绪：${intra}</div>` : "")
    + (lead ? "<h3>龙头顺序</h3>" + lead : "") + "<h3>成员</h3>" + mem + "</details>";
}
function ownSectorsHtml(d) {
  d = d || {};
  const all = d.sectors || [];
  if (!all.length) return '<div class="empty">还没有自建板块记录，后台收盘后生成（只记录，不参与交易）</div>';
  const active = all.filter((s) => s.status === "active"), proposed = all.filter((s) => s.status === "proposed");
  let html = `<div class="muted">数据日期 ${esc(d.date || "–")}（只记录，不参与交易；核心 = 对应产品收入占比 ≥ 50%）</div>`;
  if (proposed.length) {
    html += "<h3>晚报提到、等你确认的新板块</h3>" + proposed.map((s) =>
      `<div class="own-prop"><b>${esc(s.name)}</b> <input data-own-def="${esc(s.id)}" placeholder="写清核心产品，例如：xxx 的生产与销售" size="40"> `
      + `<button data-own-decide="activate" data-sector="${esc(s.id)}">启用</button> `
      + `<button data-own-decide="reject" data-sector="${esc(s.id)}">驳回</button></div>`).join("");
  }
  const pend = active.reduce((n, s) => n + s.members.filter((m) => m.status === "pending").length, 0);
  html += `<h3>板块（${esc(active.length)} 个${pend ? `，待确认成员 ${esc(pend)} 个` : ""}）</h3>` + active.map(ownSectorHtml).join("");
  return html;
}
async function renderOwnTab(body) {
  let data;

  if (tab !== "own") return;

}

function accountCard(a) {

      ${table(["代码", "名称", "股数", "成本价", "现价", "盈亏", "买入日"], a.positions.map((p) => [

function renderAccounts(accounts) {
  const byStrategy = new Map();
  for (const a of accounts) {
    if (!byStrategy.has(a.strategy)) byStrategy.set(a.strategy, []);
    byStrategy.get(a.strategy).push(a);
  }
  $("accounts").innerHTML = [...byStrategy.values()].map((group) => `
    <div class="strategy-title">${esc(group[0].strategy_name)}</div>
    <div class="cards">${group.map(accountCard).join("")}</div>`).join("");
}

// 净值曲线：各账户本金可能不同（自定义策略资金可设），统一画「相对本金的收益率 %」
let curveKey = "";
function niceStep(span) {
  const raw = span / 4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / mag;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
}
function renderCurve(curve) {
  const ids = sortAccounts(Object.keys(curve || {})).filter((id) => (curve[id] || []).length);
  const base = (id) => (accountMeta[id] && accountMeta[id].baseline) || 30000;
  const series = ids.map((id) => ({id, pts: curve[id].map(([d, v]) => ({d, v, r: (v / base(id) - 1) * 100}))}));
  // 5 秒刷新：数据没变就不重画，免得鼠标悬停时提示框闪没
  const key = JSON.stringify(series);
  if (key === curveKey && $("curveBody").firstChild) return;
  curveKey = key;
  $("curveLegend").innerHTML = series.map((s) =>
    `<span data-id="${esc(s.id)}">${swatch(s.id)}${esc(accountName(s.id))}</span>`).join("");
  const all = series.flatMap((s) => s.pts);
  if (all.length < 2) { $("curveBody").innerHTML = '<div class="empty">收盘后生成第一条记录，满两天开始画线</div>'; return; }
  const dates = [...new Set(all.map((p) => p.d))].sort();
  const vals = all.map((p) => p.r).concat([0]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 1) { const mid = (hi + lo) / 2; lo = mid - 0.5; hi = mid + 0.5; }
  const step = niceStep(hi - lo);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const W = 1000, H = 200, padX = 14;
  const xi = (i) => dates.length === 1 ? W / 2 : padX + (i / (dates.length - 1)) * (W - 2 * padX);
  const x = (d) => xi(dates.indexOf(d));
  const y = (v) => ((hi - v) / (hi - lo)) * H;
  const ticks = [];
  for (let t = lo; t <= hi + step / 2; t += step) ticks.push(+t.toFixed(6));
  // 圆点用极短的圆头线段：preserveAspectRatio="none" 会把 <circle> 拉成椭圆，non-scaling-stroke 的圆头始终是正圆
  const dot = (cx, cy, color, w) => `<path d="M${cx} ${cy}h0.01" stroke="${color}" stroke-width="${w}"
      stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
  const lines = series.map((s) => {
    const c = accountColor(s.id);
    const path = s.pts.length > 1 ? `<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"
        stroke-linecap="round" vector-effect="non-scaling-stroke"${isDashed(s.id) ? ' stroke-dasharray="7 5"' : ""}
        points="${s.pts.map((p) => `${x(p.d)},${y(p.r)}`).join(" ")}"/>` : "";
    // 每个数据点一个小圆点；只有一个点的新账户（第一天）画大一点，也能看见
    const dots = s.pts.map((p) => dot(x(p.d), y(p.r), c, s.pts.length > 1 ? 6 : 9)).join("");
    return `<g class="series" data-id="${esc(s.id)}">${path}${dots}</g>`;
  }).join("");
  const grid = ticks.map((t) => `<line class="${t === 0 ? "zero" : "grid"}" x1="0" x2="${W}" y1="${y(t)}" y2="${y(t)}"
      vector-effect="non-scaling-stroke"/>`).join("");
  const ylabs = ticks.map((t) => `<div class="ylab" style="top:calc(6px + (100% - 28px) * ${y(t) / H})">${t > 0 ? "+" : ""}${fmt(t, step < 1 ? 1 : 0)}%</div>`).join("");
  const every = Math.max(1, Math.ceil(dates.length / 7));
  const xlabs = dates.map((d, i) => (i % every === 0 || i === dates.length - 1)
    ? `<div class="xlab" style="left:${(xi(i) / W) * 100}%">${esc(d.slice(5))}</div>` : "").join("");
  $("curveBody").innerHTML = `<div class="chart" id="curveChart">${ylabs}
    <div class="plot" id="curvePlot">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${lines}
        <line class="cross" id="curveCross" x1="0" x2="0" y1="0" y2="${H}" vector-effect="non-scaling-stroke" visibility="hidden"/>
        <g id="curveHover"></g></svg>
      ${xlabs}
      <div class="tip" id="curveTip" hidden></div>
    </div></div>
    <div class="tag">纵轴为相对各自本金的收益率，鼠标移到图上看各账户明细；移到图例上单独看一条线</div>`;

  const chart = $("curveChart"), plot = $("curvePlot"), tip = $("curveTip"), cross = $("curveCross"), hover = $("curveHover");
  const focus = (id) => {
    chart.classList.toggle("focus", !!id);
    chart.querySelectorAll(".series").forEach((g) => g.classList.toggle("on", g.dataset.id === id));
  };
  $("curveLegend").querySelectorAll("span[data-id]").forEach((el) => {
    el.onmouseenter = () => focus(el.dataset.id);
    el.onmouseleave = () => focus(null);
  });
  plot.onmousemove = (ev) => {
    const rect = plot.getBoundingClientRect();
    const fx = ((ev.clientX - rect.left) / rect.width) * W;
    let idx = 0, best = Infinity;
    dates.forEach((d, i) => { const dist = Math.abs(xi(i) - fx); if (dist < best) { best = dist; idx = i; } });
    const d = dates[idx], cx = xi(idx);
    const rows = series.map((s) => ({s, p: s.pts.find((p) => p.d === d)})).filter((o) => o.p)
      .sort((a, b) => b.p.r - a.p.r);
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
    hover.innerHTML = rows.map(({s, p}) => dot(cx, y(p.r), accountColor(s.id), 12)).join("");
    // 鼠标离哪条线最近就高亮哪条，其余变淡
    const fy = ((ev.clientY - rect.top) / rect.height) * H;
    let near = null, nd = 18;
    rows.forEach(({s, p}) => { const dd = Math.abs(y(p.r) - fy); if (dd < nd) { nd = dd; near = s.id; } });
    focus(near);
    tip.innerHTML = `<div class="d">${esc(d)}</div>` + rows.map(({s, p}) =>
      `<div class="row">${swatch(s.id)}<span class="n">${esc(accountName(s.id))}</span>
        <span class="v ${signCls(p.r)}">${p.r > 0 ? "+" : ""}${fmt(p.r)}%</span>
        <span class="e">${fmt(p.v)}</span></div>`).join("");
    tip.hidden = false;
    const left = (cx / W) * rect.width;
    tip.style.left = left > rect.width * 0.55 ? `${left - tip.offsetWidth - 12}px` : `${left + 12}px`;
  };
  plot.onmouseleave = () => {
    tip.hidden = true; cross.setAttribute("visibility", "hidden"); hover.innerHTML = ""; focus(null);
  };
}

// 行内：先转义，再把 **粗体**、`代码` 换成标签，符号本身不显示
const inlineMd = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
function mdToHtml(md) {
  const out = []; let rows = [];
  const flush = () => { if (rows.length) { out.push(table(rows[0], rows.slice(1))); rows = []; } };
  for (const line of md.split("\n")) {
    if (line.startsWith("|")) {
      const cells = line.split("|").slice(1, -1).map((c) => inlineMd(VERDICT[c.trim()] || c.trim()));   // 旧报告里的 reject/pass 也显示成中文
      if (!cells.every((c) => /^-+$/.test(c))) rows.push(cells);
      continue;
    }
    flush();
    const h = /^(#{1,6})\s+(.*)$/.exec(line);   // 标题 # ~ ######：井号不显示出来
    const lv = h ? Math.min(h[1].length, 4) : 0;
    if (h) out.push(`<h${lv}>${inlineMd(h[2])}</h${lv}>`);
    else if (line.startsWith("> ")) out.push(`<blockquote>${inlineMd(line.slice(2))}</blockquote>`);
    else if (/^\s*[-*]\s+/.test(line)) out.push(`<p>• ${inlineMd(line.replace(/^\s*[-*]\s+/, ""))}</p>`);
    else if (line.trim()) out.push(`<p>${inlineMd(line)}</p>`);
  }
  flush();
  return out.join("");
}

const VERDICT = {pass: "通过", reject: "否决", error: "出错", sentiment: "情绪", skip: "跳过", gate: "闸门"};
function sentimentDetail(raw) {
  try {
    const j = JSON.parse(raw);
    const label = j.label || "未知";
    const stats = j.stats || {};
    const bits = [];
    if (stats["涨停家数"] != null) bits.push(`涨停 ${esc(stats["涨停家数"])}`);
    if (stats["跌停家数"] != null) bits.push(`跌停 ${esc(stats["跌停家数"])}`);
    if (stats["炸板率%"] != null) bits.push(`炸板率 ${esc(stats["炸板率%"])}%`);
    if (stats["最高连板"] != null) bits.push(`最高 ${esc(stats["最高连板"])} 连板`);
    if (stats["上涨家数"] != null && stats["下跌家数"] != null)
      bits.push(`涨 ${esc(stats["上涨家数"])} / 跌 ${esc(stats["下跌家数"])}`);
    if (stats["成交额较昨日同期%"] != null) bits.push(`成交额较昨日同期 ${esc(stats["成交额较昨日同期%"])}%`);
    return bits.length ? `情绪 ${esc(label)}｜${bits.join(" · ")}` : `情绪 ${esc(label)}`;
  } catch (e) {
    return "情绪 未知";
  }
}
const formatDetail = (verdict, detail) => verdict === "sentiment" ? sentimentDetail(detail) : esc(detail);
const probsTxt = (p, top) => p ? Object.entries(p).sort((a, b) => b[1] - a[1]).slice(0, top || Infinity)
  .map(([k, v]) => `${esc(k)} ${Number(v).toFixed(2)}`).join(" / ") : "";
const kv = (o) => `<div class="kv">${Object.entries(o || {}).map(([k, v]) => `<span>${esc(k)} <b>${esc(v)}</b></span>`).join("")}</div>`;

function marketBlock(title, label, tr) {
  if (!tr) return `<h4>${title}</h4><div class="tag">${esc(label || "未知")}（无 Jev 记录，按行情不好处理）</div>`;
  return `<h4>${title}：${esc(tr.label)}</h4>${kv(tr.inputs)}
    <div class="tag">Jev：${probsTxt(tr.probabilities)}${tr.confidence != null ? `（置信度 ${fmt(tr.confidence)}）` : ""}</div>`;
}

function hitValue(v) {
  if (v == null) return "—";
  if (typeof v === "boolean") return v ? "是" : "否";
  if (typeof v === "number") return String(Math.round(v * 100) / 100);
  return String(v);
}

function renderTrace(d) {
  const t = d.trace;
  const head = `<h3>${esc(d.code)} ${esc(d.name)}　${esc(d.time)}　${VERDICT[d.verdict] || esc(d.verdict)}　<span class="tag">${formatDetail(d.verdict, d.detail)}</span></h3>`;
  if (!t) return `<div class="detail">${head}<div class="tag">这条记录没有留痕数据</div></div>`;
  if (!t.candidate) return `<div class="detail">${head}${marketBlock("市场情绪", t.label, t)}</div>`;
  const c = t.candidate, parts = [head];
  const isCustom = CUSTOM_ID.test(t.strategy || "");
  if (t.strategy === "board") {
    const r = c.ranks || {};
    const sealed = t.sealed_at_snapshot;
    parts.push(`<h4>为什么被选中</h4><div>题材 ${esc(c.concept)}（热度 ${fmt(c.heat, 0)} 只涨超 5%）｜龙头分 ${fmt(c.score, 0)}` +
      `（涨幅第${fmt(r.pct, 0)}、成交额第${fmt(r.amount, 0)}、5 日涨幅第${fmt(r.ret5, 0)}）｜当前 ${fmt(c.pct)}%｜` +
      `${sealed === undefined ? "是否封死未知" : sealed ? "快照时已封死" : "快照时未封死"}</div>`);
  } else if (isCustom) {
    const hits = Array.isArray(c.hits) ? c.hits : [];
    const who = ruleNames[t.strategy] || t.strategy;
    parts.push(`<h4>命中条件（${esc(who)} v${esc(t.version ?? "?")}）</h4>` + (hits.length
      ? `<ul>${hits.map((h) => `<li>${esc(h.desc || h.field)}<span class="tag">　当时 ${esc(hitValue(h.value))}</span></li>`).join("")}</ul>`
      : '<div class="tag">没有记录命中条件</div>'));
  } else if (t.strategy === "rebound") {
    parts.push(`<h4>为什么被选中</h4><div>当前 ${fmt(c.pct)}%（0~-3% 区间）｜近 5 日 ${fmt(c.ret5)}%（跌得多的优先）｜候选排名 ${esc(c.rank)}/${esc(c.of)}｜现价 ${fmt(c.price)}` +
      `${c.shrink_days != null ? `｜连续缩量 ${esc(c.shrink_days)} 天` : ""}</div>`);
  }
  if (Array.isArray(t.notices)) {      // 2026-09-26 之前的旧留痕：每条公告一个判定
    const flagged = t.notices.filter((n) => n.mine || n.unsure);
    const rest = t.notices.filter((n) => !(n.mine || n.unsure));
    const restShown = noticesExpanded ? rest : rest.slice(0, 5);
    const remaining = rest.length - restShown.length;
    const ordered = [...flagged, ...restShown];
    const noticeRow = (n) => [esc(n.date), esc(n.title),
      esc(n.label) + (n.mine ? " ❌" : "") + (n.unsure ? " ⚠️拿不准" : ""),
      n.source === "keyword" ? "标题关键词命中，未调用 Jev"
        : `Jev：${probsTxt(n.probabilities, 2)}（置信度 ${fmt(n.confidence)}）`];
    parts.push(`<h4>公告排雷（近 90 天 ${t.notices.length} 条）</h4>` +
      (t.notices.length ? table(["日期", "标题", "判定", "依据"], ordered.map(noticeRow), [1]) : '<div class="tag">无公告</div>') +
      (remaining > 0 ? `<div class="tag" id="noticesExpand" style="cursor:pointer;color:var(--accent)">展开全部 ${remaining} 条</div>` : ""));
  } else if (t.notices) {                // 新留痕：标题粗筛出的疑似 + 正文风险分
    const sus = t.notices.suspects || [], skipped = t.notices.skipped || [];
    const LEVELS = ["高", "中", "低", "无"];
    const pct = (v) => Math.max(0, Math.min(1, Number(v) || 0)) * 100;
    const probBar = (p) => {
      p = p || {};
      const segs = [["h", "高"], ["m", "中"], ["l", "低"]]
        .map(([cls, k]) => `<i class="${cls}" style="width:${pct(p[k]).toFixed(0)}%"></i>`).join("");
      const txt = LEVELS.filter((k) => p[k] != null).map((k) => `${esc(k)} ${fmt(p[k])}`).join(" ");
      return `<span class="risk-bar">${segs}</span><span class="risk-probs">${txt}</span>`;
    };
    const verdictTag = (v) => v === "reject" ? '<b class="risk-hi">高风险</b>'
      : v === "unsure" ? '<b class="risk-mid">拿不准</b>' : v === "pass" ? '<span class="tag">放行</span>' : "";
    // Jev 中途失败：trace 只有判完的那部分（甚至是空的），不能显示成「没有疑似雷」
    const incomplete = t.notices.incomplete || (d.verdict === "error" && d.detail === "Jev 不可用");
    const levelCls = (lv) => lv === "高" ? "risk-hi" : lv === "中" ? "risk-mid" : "";
    const row = (s) => [
      esc(s.date) + (s.days_ago != null ? `<span class="tag">　${esc(s.days_ago)} 天前</span>` : ""),
      esc(s.title) + (s.body_read && s.excerpt
        ? `<details class="risk-excerpt"><summary>正文摘要</summary><div>${esc(s.excerpt)}</div></details>` : ""),
      esc(s.category),
      `<span class="${levelCls(s.level)}">${esc(s.level)} · ${fmt(s.score)}</span>　${verdictTag(s.verdict)}`,
      probBar(s.probs),
      s.body_read ? "已读正文" : '<span class="risk-mid">仅标题</span>'];
    parts.push(`<h4>公告风险（近 90 天：疑似 ${sus.length} 条，其余 ${esc(t.notices.others || 0)} 条无关公告）</h4>` +
      (incomplete ? '<div class="risk-hi">Jev 中途不可用，公告没判完：下面只是已判完的部分，不代表没有雷</div>' : "") +
      (sus.length ? table(["日期", "标题", "类别", "等级 · 风险分", "Jev 概率", "依据"], sus.map(row), [1])
                  : incomplete ? "" : '<div class="tag">没有疑似雷的公告</div>') +
      (skipped.length ? `<details class="risk-excerpt"><summary>另有 ${skipped.length} 条疑似超过每票细判上限，未细判</summary>` +
        `<div>${skipped.map((k) => `${esc(k.date)} ${esc(k.title)}（${esc(k.category)}）`).join("<br>")}</div></details>` : ""));
  }
  if (t.news) {
    const news = t.news.news || [];
    parts.push(`<h4>消息面（近 24 小时 ${news.length} 条）→ ${esc(t.news.label)}</h4>`
      + (news.length ? `<ul>${news.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>` : '<div class="tag">无新闻，按中性处理</div>')
      + (t.news.probabilities ? `<div class="tag">Jev：${probsTxt(t.news.probabilities)}${t.news.confidence != null ? `（置信度 ${fmt(t.news.confidence)}）` : ""}</div>` : ""));
  }
  if (t.strategy === "rebound") {        // 超跌反弹只看情绪，不看外围；扫首板和自定义策略不显示市场
    const m = t.market || {};
    parts.push(`<h4>当时市场：${m.mode === "none" ? "情绪不好，不买" : m.mode === "turn" ? "情绪拐点，抄底" : m.mode === "tail" ? "只在尾盘买" : "盘中可买"}</h4>`);
    parts.push(marketBlock("市场情绪", m.sentiment, m.sentiment_trace));
  }
  const o = t.outcome || {};
  parts.push(`<h4>结论</h4><div>${o.bought ? `买入 ${esc(o.shares)} 股 @ ${fmt(o.price)}` : `未买入（${esc(d.detail)}）`}</div>`);
  return `<div class="detail">${parts.join("")}</div>`;
}

function strategyFilters() {
  const out = [[null, "全部"], ["board", "扫首板"], ["rebound", "超跌反弹"]];
  const custom = {...ruleNames};
  for (const m of Object.values(accountMeta)) if (CUSTOM_ID.test(m.strategy || "")) custom[m.strategy] = m.strategyName;
  Object.keys(custom).sort((a, b) => Number(a.slice(1)) - Number(b.slice(1)))
    .forEach((id) => out.push([id, custom[id] || id]));
  return out;
}

// 「情绪」页（用户 2026-10-09）：每天一根情绪 K 线——Jev 四档概率的期望分（冰点 0 / 偏弱 1 / 正常 2 / 火热 3），
// 开 = 当天第一次判断、收 = 最后一次、高低 = 当天最高最低；下面配涨停（向上）/跌停（向下）柱。点某天看当天每 10 分钟明细。
const MOOD_LV = ["冰点", "偏弱", "正常", "火热"];
let moodSel = null;
const moodLabel = (v) => v == null ? "–" : `${MOOD_LV[Math.max(0, Math.min(3, Math.round(v)))]} ${fmt(v, 2)}`;
function moodHtml(data) {
  const days = (data && data.days) || [];
  if (!days.length) return '<div class="empty">还没有情绪记录：交易日后台每 10 分钟判一次，开盘后就有</div>';
  const W = 1000, H1 = 200, H2 = 120, pad = 14, n = days.length;
  const slot = (W - 2 * pad) / n, bw = Math.max(2, Math.min(slot * 0.6, 36));
  const cx = (i) => pad + slot * (i + 0.5);
  const y1 = (v) => 8 + ((3 - v) / 3) * (H1 - 16);
  const grid = [0, 1, 2, 3].map((v) => `<line class="grid" x1="0" x2="${W}" y1="${y1(v)}" y2="${y1(v)}" vector-effect="non-scaling-stroke"/>`).join("");
  const ylabs = [0, 1, 2, 3].map((v) => `<div class="ylab" style="top:calc(8px + (100% - 36px) * ${y1(v) / H1})">${MOOD_LV[v]}</div>`).join("");
  const candles = days.map((d, i) => {
    if (d.open == null) return "";
    const up = d.close >= d.open, color = up ? "var(--up)" : "var(--down)";
    const top = y1(Math.max(d.open, d.close)), h = Math.max(1.5, Math.abs(y1(d.open) - y1(d.close)));
    return `<g data-i="${i}"><line x1="${cx(i)}" x2="${cx(i)}" y1="${y1(d.high)}" y2="${y1(d.low)}" style="stroke:${color}"
        stroke-width="1.5" vector-effect="non-scaling-stroke"/>
      <rect x="${cx(i) - bw / 2}" y="${top}" width="${bw}" height="${h}" style="fill:${up ? "var(--card)" : color};stroke:${color}"
        stroke-width="1.5" vector-effect="non-scaling-stroke"/></g>`;
  }).join("");
  const turns = days.map((d, i) => d.turn && d.high != null
    ? `<div class="mood-turn" style="left:${cx(i) / W * 100}%;top:${y1(d.high) / H1 * 100}%">拐</div>` : "").join("");
  const maxv = Math.max(1, ...days.map((d) => Math.max(d.limit_up || 0, d.limit_down || 0)));
  const mid = H2 / 2, yb = (v) => (v / maxv) * (mid - 14);      // 下沿留出日期标签的位置
  const bars = days.map((d, i) => `<rect x="${cx(i) - bw / 2}" y="${mid - yb(d.limit_up || 0)}" width="${bw}" height="${yb(d.limit_up || 0)}" style="fill:var(--up)" fill-opacity=".75"/>
      <rect x="${cx(i) - bw / 2}" y="${mid}" width="${bw}" height="${yb(d.limit_down || 0)}" style="fill:var(--down)" fill-opacity=".75"/>`).join("");
  const every = Math.max(1, Math.ceil(n / 8));
  const xlabs = days.map((d, i) => (i % every === 0 || i === n - 1)
    ? `<div class="xlab" style="left:${cx(i) / W * 100}%">${esc(d.date.slice(5))}</div>` : "").join("");
  const last = days[n - 1];
  const head = `<div class="mood-head"><b>${esc(last.date)}　${esc(last.label || "未判")}</b>
    <span class="tag">情绪分 开 ${esc(moodLabel(last.open))} → 收 ${esc(moodLabel(last.close))}</span>
    <span class="tag">涨停 <b class="up">${esc(last.limit_up ?? "–")}</b>　跌停 <b class="down">${esc(last.limit_down ?? "–")}</b>
    　炸板率 ${last.break_rate == null ? "–" : fmt(last.break_rate, 1) + "%"}　最高 ${esc(last.max_board ?? "–")} 板</span>
    ${last.turn ? `<span class="tag">情绪拐点 <b>${esc(last.turn)}</b></span>` : ""}</div>`;
  return head + `<div class="chart mood" id="moodChart">${ylabs}<div class="plot" id="moodPlot">
      <svg viewBox="0 0 ${W} ${H1}" preserveAspectRatio="none">${grid}${candles}
        <line class="cross" id="moodCross" x1="0" x2="0" y1="0" y2="${H1}" vector-effect="non-scaling-stroke" visibility="hidden"/></svg>
      ${turns}<div class="tip" id="moodTip" hidden></div></div></div>
    <div class="chart mood-bars"><div class="ylab" style="top:12%">涨停</div><div class="ylab" style="top:88%">跌停</div>
      <div class="plot"><svg viewBox="0 0 ${W} ${H2}" preserveAspectRatio="none">
        <line class="zero" x1="0" x2="${W}" y1="${mid}" y2="${mid}" vector-effect="non-scaling-stroke"/>${bars}</svg>${xlabs}</div></div>
    <div class="tag">K 线是 Jev 判的短线情绪（空心红 = 当天转好，实心绿 = 当天转差）；「拐」= 当天确认了情绪拐点（恐慌后的修复）。
      鼠标移到图上看明细，点某一天看当天每 10 分钟的判断</div><div id="moodDay"></div>`;
}
function moodDayHtml(d) {
  if (!d) return "";
  return `<h3>${esc(d.date)} 盘中情绪（${esc(d.n)} 次判断${d.turn ? `，${esc(d.turn)} 确认拐点` : ""}）</h3>` +
    table(["时间", "Jev 情绪", "情绪分", "涨停", "跌停", "炸板率", "红盘", "绿盘", "成交额较昨日同期"],
      d.points.map((p) => [esc(p.time), esc(p.label || "未判"), p.score == null ? "–" : fmt(p.score, 2),
        esc(p.limit_up ?? "–"), esc(p.limit_down ?? "–"), p.break_rate == null ? "–" : fmt(p.break_rate, 1) + "%",
        esc(p.up ?? "–"), esc(p.down ?? "–"), p.amount_ratio == null ? "–" : fmt(p.amount_ratio, 1) + "%"]));
}
function bindMood(body, data) {
  const days = (data && data.days) || [];
  const plot = body.querySelector("#moodPlot");
  if (!plot) return;
  const W = 1000, pad = 14, slot = (W - 2 * pad) / days.length;
  const tip = body.querySelector("#moodTip"), cross = body.querySelector("#moodCross");
  const pick = (ev) => {
    const rect = plot.getBoundingClientRect();
    const fx = ((ev.clientX - rect.left) / rect.width) * W;
    return [Math.max(0, Math.min(days.length - 1, Math.floor((fx - pad) / slot))), rect];
  };
  const showDay = (date) => { body.querySelector("#moodDay").innerHTML = moodDayHtml(days.find((d) => d.date === date)); };
  plot.onmousemove = (ev) => {
    const [i, rect] = pick(ev), d = days[i], x = pad + slot * (i + 0.5);
    cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("visibility", "visible");
    tip.innerHTML = `<div class="d">${esc(d.date)}　${esc(d.label || "未判")}${d.turn ? `　拐点 ${esc(d.turn)}` : ""}</div>`
      + [["开", moodLabel(d.open)], ["高", moodLabel(d.high)], ["低", moodLabel(d.low)], ["收", moodLabel(d.close)],
         ["涨停 / 跌停", `${d.limit_up ?? "–"} / ${d.limit_down ?? "–"}`],
         ["炸板率", d.break_rate == null ? "–" : fmt(d.break_rate, 1) + "%"], ["最高连板", d.max_board ?? "–"],
         ["红盘 / 绿盘", `${d.up ?? "–"} / ${d.down ?? "–"}`], ["外围", d.overseas || "–"]]
        .map(([k, v]) => `<div class="row"><span class="n">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join("");
    tip.hidden = false;
    const left = (x / W) * rect.width;
    tip.style.left = left > rect.width * 0.55 ? `${left - tip.offsetWidth - 12}px` : `${left + 12}px`;
  };
  plot.onmouseleave = () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); };
  plot.onclick = (ev) => { moodSel = days[pick(ev)[0]].date; showDay(moodSel); };
  showDay(moodSel && days.some((d) => d.date === moodSel) ? moodSel : days[days.length - 1].date);
}

async function renderTab() {
  const body = $("tabBody");
  // 每次 await 之后确认用户还停在发起时的标签：否则 5 秒刷新里慢回来的「今日成交」等结果
  // 会把刚切过去的标签（尤其是规则编辑器）整个盖掉
  const want = tab, moved = () => tab !== want;
  if (tab === "fills") {
    const rows = await api.fills(today);
    if (moved()) return;
    body.innerHTML = table(["时间", "账户", "代码", "名称", "方向", "价格", "股数", "费用", "理由"],
      rows.map((f) => [esc(f.time), swatch(f.account_id) + esc(f.account), esc(f.code), esc(f.name), esc(f.side),
        fmt(f.price), esc(f.shares), fmt(f.fee), esc(f.reason)]));
  } else if (tab === "decisions") {
    const rows = await api.decisions(today, strategyFilter);
    const detail = selectedId != null ? await api.decision(selectedId) : null;
    if (moved()) return;
    const filters = strategyFilters();
    const filterBar = `<div class="tabs">${filters.map(([v, label]) =>
      `<button data-strategy="${esc(v ?? "")}" class="${strategyFilter === v ? "active" : ""}">${esc(label)}</button>`).join("")}</div>`;
    body.innerHTML = filterBar + (detail ? renderTrace(detail) : "") + `<div class="clickable">${table(["", "时间", "代码", "名称", "结果", "理由"],
      rows.map((d) => [d.has_trace ? ic("chev-right") : "", esc(d.time), esc(d.code), esc(d.name), VERDICT[d.verdict] || esc(d.verdict), formatDetail(d.verdict, d.detail)]))}</div>`;
    body.querySelectorAll("[data-strategy]").forEach((b) => b.onclick = () => {
      strategyFilter = b.dataset.strategy || null; selectedId = null; noticesExpanded = false; renderTab();
    });
    body.querySelectorAll(".clickable tr").forEach((tr, i) => {
      if (i === 0) return;                                   // 表头
      const d = rows[i - 1];
      tr.dataset.id = d.id;
      tr.classList.toggle("sel", d.id === selectedId);
      tr.onclick = () => {
        if (selectedId !== d.id) noticesExpanded = false;    // 切换到另一条决策，重置展开状态
        selectedId = selectedId === d.id ? null : d.id; renderTab();
      };
    });
    const expandBtn = body.querySelector("#noticesExpand");
    if (expandBtn) expandBtn.onclick = () => { noticesExpanded = true; renderTab(); };
  } else if (tab === "own") {
    await renderOwnTab(body);
  } else if (tab === "mood") {
    let data;
    try { data = await api.sentiment_board(60); } catch (e) { data = {days: []}; }
    if (moved()) return;
    body.innerHTML = moodHtml(data);
    bindMood(body, data);
  } else if (tab === "candidates") {
    const data = await api.candidates();
    if (moved()) return;
    body.innerHTML = candidatesHtml(data);
  } else if (tab === "board") {
    const rows = await api.board_stats();
    if (moved()) return;
    body.innerHTML = table(["时段", "样本数", "次日平均高开", "次日平均收盘", "次日连板率"],
      rows.map((r) => [esc(r.bucket), esc(r.count), fmt(r.avg_next_open) + "%", fmt(r.avg_next_close) + "%", fmt(r.board_rate, 1) + "%"]));
  } else if (tab === "rules") {
    await renderRulesTab(body);
  } else if (tab === "reports") {
    const names = await api.reports();
    if (moved()) return;
    if (!names.length) { body.innerHTML = '<div class="empty">还没有复盘报告，第一个交易日 15:05 后生成</div>'; return; }
    body.innerHTML = `<div class="layout"><div class="report-list">${names.map((n) =>
      `<button data-report="${esc(n)}">${esc(n.replace(".md", ""))}</button>`).join("")}</div><div class="md" id="md"></div></div>`;
    body.querySelectorAll("[data-report]").forEach((b) =>
      b.onclick = async () => {
        body.querySelectorAll("[data-report]").forEach((x) => x.classList.toggle("on", x === b));
        $("md").innerHTML = mdToHtml(await api.report(b.dataset.report));
      });
    body.querySelector("[data-report]").click();
  } else if (tab === "knowledge") {
    await renderKnowledgeTab(body);
  } else {
    const lines = await api.logs();
    if (moved()) return;
    body.innerHTML = `<div id="log">${lines.length ? esc(lines.join("\n")) : "暂无日志"}</div>`;
    $("log").scrollTop = 1e9;
  }
}

// ======================= 规则页：策略列表 + 盘口指标墙编辑器 =======================
// 所有状态放在 R 里；定义（R.draft）只以 JSON 对象经 Api 发送，从不拼进 HTML。
// 页面上出现的外部字符串（策略名、字段名、错误信息、股票名……）一律经 esc()。
const GROUP_ORDER = ["价格", "量能", "估值", "历史", "题材", "持仓", "环境", "其他"];
const OP_SIGN = {">": ">", ">=": "≥", "<": "<", "<=": "≤"};
const R = {
  fields: null, byKey: {}, rules: [], builtin: [], loadError: "",
  sel: null,            // {kind: "builtin"|"custom"|"new", id}
  draft: null, sid: null, open: [],
  errors: [], warnings: [], checking: false, vTimer: null, vSeq: 0,
  preview: null, previewErr: "", previewing: false, showTable: false, pTimer: null, pSeq: 0,
  pop: null, history: null, confirmDisable: false, saving: false, notice: null,
};
const clone = (o) => JSON.parse(JSON.stringify(o));

function blankSpec() {
  return {name: "", capital: 30000,
    select: {mode: "all", conditions: []}, rank: null, entry: {mode: "all", conditions: []},
    exits: [{reason: "止损", when: {mode: "all", conditions: [{field: "pnl_pct", op: "<=", value: -3}]}}],
    jev: {notices: true, news: true}};
}

function normalizeSpec(spec) {       // 已保存的定义补齐成编辑器用的统一形状
  const s = clone(spec || {});
  const grp = (g) => ({mode: g && g.mode === "any" ? "any" : "all",
    conditions: g && Array.isArray(g.conditions) ? g.conditions : []});
  const jev = s.jev || {};
  return {name: s.name || "", capital: s.capital ?? 30000, select: grp(s.select), rank: s.rank || null,
    entry: grp(s.entry),
    exits: (Array.isArray(s.exits) ? s.exits : []).map((e, i) => ({reason: e.reason || `卖出规则${i + 1}`, when: grp(e.when)})),
    jev: {notices: jev.notices !== false, news: jev.news !== false}};
}

function specOut() {
  const d = R.draft;
  return clone({name: String(d.name || "").trim(), capital: d.capital, select: d.select, rank: d.rank,
    entry: d.entry, exits: d.exits, jev: d.jev});
}

const errText = (res, fallback) => ((res && (res.errors || (res.error ? [res.error] : null))) || [fallback]).join("；");

async function loadRules() {
  let res;
  try { res = await api.rules_list(); } catch (e) { res = {ok: false, errors: [String(e)]}; }
  if (!res || !res.ok) { R.loadError = errText(res, "未知错误"); return; }
  R.loadError = ""; R.rules = res.rules || []; R.builtin = res.builtin || [];
  ruleNames = Object.fromEntries(R.rules.map((r) => [r.id, r.name]));
}

async function ensureFields() {
  if (R.fields) return true;
  let res;
  try { res = await api.rule_fields(); } catch (e) { res = null; }
  if (!res || !res.ok) return false;
  R.fields = res.fields || [];
  R.byKey = Object.fromEntries(R.fields.map((f) => [f.key, f]));
  return true;
}

async function renderRulesTab(body) {
  const ok = await ensureFields();
  await loadRules();
  if (tab !== "rules") return;
  if (!ok) { body.innerHTML = '<div class="empty err-text">指标定义加载失败，请重开面板</div>'; return; }
  body.innerHTML = `<div class="rules-layout"><div class="rule-list" id="ruleList"></div>
    <div id="ruleMain"></div><div class="rule-aside" id="ruleAside"></div></div>`;
  $("ruleList").onclick = onRuleListClick;
  renderRuleList();
  renderRuleMain();
}

function ruleBadge(r) {
  const pending = r.active_from && today && r.active_from > today;
  if (r.enabled) {
    if (!r.running) return ["pending", `${r.active_from} 生效`];
    return pending ? ["on", `运行中 · v${r.version} 于 ${r.active_from} 生效`] : ["on", "运行中"];
  }
  if (r.running) return pending ? ["on", `运行中 · ${r.active_from} 停用`] : ["off", "已停用 · 清仓中"];
  return ["off", "已停用"];
}

function renderRuleList() {
  const el = $("ruleList");
  if (!el) return;
  const selKey = R.sel ? `${R.sel.kind}:${R.sel.id || ""}` : "";
  const item = (key, title, meta) =>
    `<button class="rl-item${selKey === key ? " active" : ""}" data-sel="${esc(key)}"><b>${esc(title)}</b><span class="rl-meta">${meta}</span></button>`;
  const custom = R.rules.map((r) => {
    const [cls, text] = ruleBadge(r);
    return item(`custom:${r.id}`, r.name, `<span class="badge ${cls}">${esc(text)}</span> ${esc(r.id)} · v${esc(r.version)}`);
  });
  if (R.sel && R.sel.kind === "new") custom.unshift(item("new:", (R.draft && R.draft.name) || "新策略", '<span class="badge pending">未保存</span>'));
  el.innerHTML = `<button class="primary" data-sel="new:">+ 新建策略</button>
    <div class="rl-title">内置（只读）</div>
    ${R.builtin.map((b) => item(`builtin:${b.id}`, b.name, "内置")).join("")}
    <div class="rl-title">自定义</div>
    ${custom.length ? custom.join("") : '<div class="tag">还没有自定义策略</div>'}
    ${R.loadError ? `<div class="err-text">列表加载失败：${esc(R.loadError)}</div>` : ""}`;
}

function onRuleListClick(ev) {
  const b = ev.target.closest("[data-sel]");
  if (!b) return;
  const [kind, ...rest] = b.dataset.sel.split(":");
  selectRule(kind, rest.join(":"));
}

function resetEditorState() {
  closePop();
  clearTimeout(R.vTimer); clearTimeout(R.pTimer);
  R.vSeq++; R.pSeq++;
  Object.assign(R, {errors: [], warnings: [], checking: false, preview: null, previewErr: "", previewing: false,
    showTable: false, history: null, confirmDisable: false, notice: null});
}

function selectRule(kind, id) {
  resetEditorState();
  if (kind === "builtin") {
    R.sel = {kind, id}; R.draft = null; R.sid = null;
  } else if (kind === "custom") {
    const r = R.rules.find((x) => x.id === id);
    if (!r) return;
    R.sel = {kind, id}; R.sid = id; R.draft = normalizeSpec(r.spec);
    R.open = R.draft.exits.map(() => false);
  } else {
    R.sel = {kind: "new", id: ""}; R.sid = null; R.draft = blankSpec(); R.open = [true];
  }
  renderRuleList();
  renderRuleMain();
  if (R.draft) kick(true);
}

  $("rJevNews").onchange = (e) => { d.jev.news = e.target.checked; changed(false); };
