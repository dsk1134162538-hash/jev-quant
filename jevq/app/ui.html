function renderHead() {
  const el = $("ruleHead");
  if (!el) return;
  const r = R.sid ? R.rules.find((x) => x.id === R.sid) : null;
  el.innerHTML = r
    ? `<span class="rh-title">${esc(r.name)}</span><span class="tag">${esc(r.id)} · 最新 v${esc(r.version)} · ${esc(r.active_from)} 生效</span>
       <span class="spacer"></span>
       <button id="btnCopyRule">复制</button>
       <button id="btnHistory">${R.history ? "收起历史" : "版本历史"}</button>
       ${r.enabled ? `<button id="btnDisable" class="${R.confirmDisable ? "danger" : ""}">${R.confirmDisable ? "确认停用（明日生效）" : "停用"}</button>` : ""}`
    : `<span class="rh-title">新建策略</span><span class="tag">点指标方块设置条件，右侧实时体检</span>`;
  if (!r) return;
  $("btnCopyRule").onclick = copyRule;
  $("btnHistory").onclick = toggleHistory;
  if ($("btnDisable")) $("btnDisable").onclick = disableRule;
}

function renderRank() {
  const el = $("rankRow");
  if (!el) return;
  const d = R.draft, rk = d.rank, f = rk && R.byKey[rk.field];
  const opts = R.fields.filter((x) => x.kind === "num" && (x.scopes || []).includes("select"));
  el.innerHTML = `<span class="lbl">排序</span><select id="rRankField"><option value="">不排序</option>${opts.map((o) =>
      `<option value="${esc(o.key)}">${esc(o.label)}</option>`).join("")}</select>` +
    (f && f.params.length ? `<select id="rRankN">${f.params.map((n) => `<option value="${esc(n)}">N=${esc(n)}</option>`).join("")}</select>` : "") +
    (f ? '<select id="rRankOrder"><option value="desc">从高到低</option><option value="asc">从低到高</option></select>' : "");
  $("rRankField").value = f ? rk.field : "";
  if ($("rRankN")) $("rRankN").value = String((rk.param || {}).n ?? f.params[0]);
  if ($("rRankOrder")) $("rRankOrder").value = rk.order === "asc" ? "asc" : "desc";
  $("rRankField").onchange = (e) => {
    const nf = R.byKey[e.target.value];
    d.rank = nf ? {field: nf.key, order: (d.rank && d.rank.order) || "desc"} : null;
    if (nf && nf.params.length) d.rank.param = {n: nf.params[0]};
    renderRank(); changed(true);
  };
  if ($("rRankN")) $("rRankN").onchange = (e) => { d.rank.param = {n: Number(e.target.value)}; changed(true); };
  if ($("rRankOrder")) $("rRankOrder").onchange = (e) => { d.rank.order = e.target.value; changed(true); };
}

// ---- 指标墙 ----
function groupOf(area, idx) { return area === "exit" ? R.draft.exits[idx].when : R.draft[area]; }

function fieldLabel(f, c) {
  const n = c && c.param ? c.param.n : null;
  return n != null && f.label.includes("N") ? f.label.replace("N", n) : f.label;
}
function valText(f, v) {
  if (v == null || v === "" || (typeof v === "number" && Number.isNaN(v))) return "?";
  return f.kind === "num" ? `${v}${f.unit || ""}` : String(v);
}
function condText(f, c) {
  const v = c.value;
  if (c.op === "between") return Array.isArray(v) ? `${valText(f, v[0])}~${valText(f, v[1])}` : "?";
  if (c.op === "is") return v ? "是" : "否";
  if (c.op === "in") return Array.isArray(v) && v.length ? v.join("/") : "?";
  return `${OP_SIGN[c.op] || c.op} ${valText(f, v)}`;
}
function condLine(c) {
  const f = R.byKey[c.field];
  return f ? `${fieldLabel(f, c)} ${condText(f, c)}` : String(c.field);
}

function modeSeg(area, idx, mode) {
  return `<span class="seg">${[["all", "全部满足"], ["any", "任一满足"]].map(([m, label]) =>
    `<button type="button" data-mode="${m}" data-area="${area}" data-exit="${idx}" class="${mode === m ? "on" : ""}">${label}</button>`).join("")}</span>`;
}

function tileHtml(area, idx, f, group) {
  const same = group.conditions.filter((c) => c.field === f.key);
  const c = same[0];
  const editing = R.pop && R.pop.area === area && R.pop.exit === idx && R.pop.key === f.key;
  const val = c ? esc(condText(f, c)) + (same.length > 1 ? ` <small>+${same.length - 1}</small>` : "") : (editing ? "设置中…" : "—");
  return `<button type="button" class="tile${c ? " on" : ""}${editing ? " editing" : ""}" data-tile="${esc(f.key)}"
    data-area="${area}" data-exit="${idx}" title="${esc(f.label)}"><span class="t-label">${esc(c ? fieldLabel(f, c) : f.label)}</span><span class="t-val">${val}</span></button>`;
}

function wallHtml(area, idx, group) {
  const fields = R.fields.filter((f) => (f.scopes || []).includes(area));
  const groupName = (f) => GROUP_ORDER.includes(f.group) ? f.group : "其他";
  return GROUP_ORDER.map((g) => {
    const fs = fields.filter((f) => groupName(f) === g);
    if (!fs.length) return "";
    return `<div class="wall-group"><div class="g-title">${esc(g)}</div>
      <div class="wall-grid">${fs.map((f) => tileHtml(area, idx, f, group)).join("")}</div></div>`;
  }).join("");
}

function areaHtml(area, title, hint) {
  const g = R.draft[area];
  return `<section class="wall-area"><div class="wall-head"><h3>${title}</h3>${modeSeg(area, -1, g.mode)}
    <span class="tag">${hint}　已选 ${g.conditions.length} 个</span></div>${wallHtml(area, -1, g)}</section>`;
}

function exitHtml(e, i) {
  const n = R.draft.exits.length, open = R.open[i];
  const summary = e.when.conditions.map(condLine).join(e.when.mode === "any" ? " 或 " : " 且 ");
  return `<div class="exit-rule"><div class="exit-head">
      <button type="button" class="icon" data-exit-act="toggle" data-i="${i}" title="${open ? "收起" : "展开"}">${ic(open ? "chev-down" : "chev-right")}</button>
      <span class="exit-no">${i + 1}</span>
      <input class="exit-name" data-exit-name="${i}" maxlength="20" placeholder="规则名（写进成交理由）">
      ${modeSeg("exit", i, e.when.mode)}
      <span class="spacer"></span>
      <button type="button" class="icon" data-exit-act="up" data-i="${i}"${i === 0 ? " disabled" : ""} title="上移（更优先）">${ic("arrow-up")}</button>
      <button type="button" class="icon" data-exit-act="down" data-i="${i}"${i === n - 1 ? " disabled" : ""} title="下移">${ic("arrow-down")}</button>
      <button type="button" class="icon" data-exit-act="del" data-i="${i}" title="删除这条卖出规则">${ic("x")}</button>
    </div>${open ? wallHtml("exit", i, e.when)
      : `<div class="exit-sum${summary ? "" : " tag"}" data-exit-act="toggle" data-i="${i}">${summary ? esc(summary) : "还没选条件，点开设置"}</div>`}</div>`;
}

function renderWalls() {
  const box = $("wallsBox");
  if (!box || !R.draft) return;
  const d = R.draft;
  box.innerHTML = areaHtml("select", "选股", "每分钟对股票池求值，满足的进入候选") +
    areaHtml("entry", "买点", "对排好序的候选逐只检查；一个不选 = 候选直接买") +
    `<section class="wall-area"><div class="wall-head"><h3>卖出</h3>
      <span class="tag">从上往下检查，第一条满足的触发卖出；必须有一条止损</span><span class="spacer"></span>
      <button type="button" id="btnAddExit">+ 添加卖出规则</button></div>
      ${d.exits.length ? d.exits.map(exitHtml).join("") : '<div class="empty">还没有卖出规则</div>'}</section>`;
  box.querySelectorAll("[data-exit-name]").forEach((el) => { el.value = d.exits[Number(el.dataset.exitName)].reason || ""; });
}

function onWallsClick(ev) {
  const t = ev.target.closest("button, [data-exit-act]");
  if (!t || t.disabled) return;
  const d = R.draft;
  if (t.dataset.tile) { openPop(t.dataset.area, Number(t.dataset.exit), t.dataset.tile); return; }
  if (t.dataset.mode) {
    groupOf(t.dataset.area, Number(t.dataset.exit)).mode = t.dataset.mode;
    closePop(); renderWalls(); changed(t.dataset.area !== "exit");
    return;
  }
  if (t.id === "btnAddExit") {
    d.exits.push({reason: `卖出规则${d.exits.length + 1}`, when: {mode: "all", conditions: []}});
    R.open.push(true);
    closePop(); renderWalls(); changed(false);
    return;
  }
  const act = t.dataset.exitAct, i = Number(t.dataset.i);
  if (!act || !(i >= 0 && i < d.exits.length)) return;
  closePop();
  if (act === "toggle") R.open[i] = !R.open[i];
  else if (act === "del") { d.exits.splice(i, 1); R.open.splice(i, 1); }
  else {
    const j = act === "up" ? i - 1 : i + 1;
    if (j < 0 || j >= d.exits.length) return;
    [d.exits[i], d.exits[j]] = [d.exits[j], d.exits[i]];
    [R.open[i], R.open[j]] = [R.open[j], R.open[i]];
  }
  renderWalls();
  if (act !== "toggle") changed(false);
}

function onWallsInput(ev) {
  const el = ev.target;
  if (el.dataset.exitName == null) return;
  R.draft.exits[Number(el.dataset.exitName)].reason = el.value;
  changed(false);
}

// ---- 方块弹框：运算符 + 值 + N ----
function defaultCond(f) {
  const base = f.default ? clone(f.default)
    : f.kind === "bool" ? {op: "is", value: true}
    : f.kind === "enum" ? {op: "in", value: [f.choices[0]]}
    : f.kind === "time" ? {op: ">=", value: "09:30"}
    : {op: ">=", value: f.lo ?? 0};
  if (f.params.length && !(base.param && base.param.n != null)) base.param = {n: f.params[0]};
  return {field: f.key, ...base};
}

function findTile() {
  const p = R.pop;
  if (!p) return null;
  return document.querySelector(`#wallsBox [data-tile="${CSS.escape(p.key)}"][data-area="${p.area}"][data-exit="${p.exit}"]`);
}

function openPop(area, idx, key) {
  const f = R.byKey[key];
  if (!f) return;
  const g = groupOf(area, idx);
  const i = g.conditions.findIndex((c) => c.field === key);
  R.pop = {area, exit: idx, key, isNew: i < 0, cond: i >= 0 ? clone(g.conditions[i]) : defaultCond(f)};
  renderWalls();
  drawPop();
}

function closePop() {
  R.pop = null;
  const el = $("rulePop");
  if (el) el.remove();
}

function valueControlHtml(f, op) {
  if (f.kind === "bool") return '<select id="popV0"><option value="true">是</option><option value="false">否</option></select>';
  if (f.kind === "enum") return f.choices.map((ch, k) => `<label class="chk"><input type="checkbox" data-k="${k}"> ${esc(ch)}</label>`).join("");
  const input = (id) => f.kind === "time" ? `<input type="time" id="${id}">` : `<input type="number" step="any" id="${id}">`;
  const unit = f.unit ? `<span class="tag">${esc(f.unit)}</span>` : "";
  return op === "between" ? `${input("popV0")} ~ ${input("popV1")} ${unit}` : `${input("popV0")} ${unit}`;
}

function fillValues(f, c) {
  const el = $("rulePop"), v = c.value;
  if (f.kind === "bool") { $("popV0").value = v ? "true" : "false"; return; }
  if (f.kind === "enum") {
    el.querySelectorAll("[data-k]").forEach((cb) => { cb.checked = Array.isArray(v) && v.includes(f.choices[Number(cb.dataset.k)]); });
    return;
  }
  const put = (id, x) => { if ($(id)) $(id).value = x == null ? "" : String(x); };
  if (c.op === "between") { put("popV0", Array.isArray(v) ? v[0] : v); put("popV1", Array.isArray(v) ? v[1] : v); }
  else put("popV0", Array.isArray(v) ? v[0] : v);
}

function readValues(f, c) {     // 弹框里的值 → c.value（数字转成 number，空/非法为 null，交给服务端体检报错）
  const el = $("rulePop");
  if (!el) return;
  if (f.kind === "bool") { c.value = $("popV0").value === "true"; return; }
  if (f.kind === "enum") {
    c.value = f.choices.filter((_, k) => { const cb = el.querySelector(`[data-k="${k}"]`); return cb && cb.checked; });
    return;
  }
  const get = (id) => {
    const raw = $(id) ? $(id).value.trim() : "";
    if (f.kind === "time") return raw ? raw.slice(0, 5) : null;
    return raw === "" || !Number.isFinite(Number(raw)) ? null : Number(raw);
  };
  c.value = c.op === "between" ? [get("popV0"), get("popV1")] : get("popV0");
}

function convertValue(f, c, newOp) {     // 切换运算符时尽量保留已填的值
  const cur = c.value;
  if (newOp === "between") {
    if (Array.isArray(cur)) return cur;
    if (cur == null && f.default && f.default.op === "between") return clone(f.default.value);
    return [cur, cur];
  }
  if (Array.isArray(cur)) return newOp === "<" || newOp === "<=" ? cur[1] : cur[0];
  return cur;
}

function drawPop() {
  const p = R.pop;
  if (!p) return;
  const f = R.byKey[p.key], c = p.cond;
  let el = $("rulePop");
  if (!el) {
    el = document.createElement("div");
    el.id = "rulePop"; el.className = "rule-pop";
    document.body.appendChild(el);
    el.onclick = onPopClick;
    el.onchange = onPopChange;
    el.onkeydown = (ev) => { if (ev.key === "Enter" && ev.target.tagName === "INPUT") { ev.preventDefault(); confirmPop(); } };
  }
  const ops = f.ops || [];
  el.innerHTML = `<div class="pop-title">${esc(f.label)}${f.unit ? `<span class="tag">（${esc(f.unit)}）</span>` : ""}
      <span class="spacer"></span><button type="button" class="icon" data-pop="close" title="关闭（不保存）">${ic("x")}</button></div>
    <div class="pop-row">
      ${f.params.length ? `<select id="popN">${f.params.map((n) => `<option value="${esc(n)}">N=${esc(n)}</option>`).join("")}</select>` : ""}
      ${ops.length > 1 ? `<select id="popOp">${ops.map((o) => `<option value="${esc(o.op)}">${esc(o.label)}</option>`).join("")}</select>`
        : `<span>${esc((ops[0] || {}).label || "")}</span>`}
    </div>
    <div class="pop-row" id="popVal">${valueControlHtml(f, c.op)}</div>
    ${f.kind === "num" && f.lo != null && f.hi != null ? `<div class="tag">可填 ${esc(f.lo)} ~ ${esc(f.hi)}</div>` : ""}
    <div class="pop-actions"><button type="button" class="link" data-pop="clear">取消选择</button>
      <span class="spacer"></span><button type="button" class="primary" data-pop="ok">确定</button></div>`;
  if ($("popN")) $("popN").value = String((c.param || {}).n ?? f.params[0]);
  if ($("popOp")) $("popOp").value = c.op;
  fillValues(f, c);
  placePop();
  const first = el.querySelector("#popV0");
  if (first && first.tagName === "INPUT") first.focus();
}

function placePop() {
  const el = $("rulePop"), tile = findTile();
  if (!el || !tile) return;
  const r = tile.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  const left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
  let top = r.bottom + 6;
  if (top + h > window.innerHeight - 8 && r.top - h - 6 > 8) top = r.top - h - 6;
  el.style.left = `${left + window.scrollX}px`;
  el.style.top = `${top + window.scrollY}px`;
}

function onPopChange(ev) {
  const p = R.pop;
  if (!p) return;
  const f = R.byKey[p.key];
  if (ev.target.id === "popN") { p.cond.param = {n: Number(ev.target.value)}; return; }
  if (ev.target.id === "popOp") {
    readValues(f, p.cond);
    const newOp = ev.target.value;
    p.cond.value = convertValue(f, p.cond, newOp);
    p.cond.op = newOp;
    $("popVal").innerHTML = valueControlHtml(f, newOp);
    fillValues(f, p.cond);
    placePop();
  }
}

function onPopClick(ev) {
  const b = ev.target.closest("[data-pop]");
  if (!b || !R.pop) return;
  const act = b.dataset.pop;
  if (act === "ok") { confirmPop(); return; }
  if (act === "clear") {
    const p = R.pop, g = groupOf(p.area, p.exit);
    const i = g.conditions.findIndex((c) => c.field === p.key);
    closePop();
    if (i >= 0) { g.conditions.splice(i, 1); changed(p.area !== "exit"); }
    renderWalls();
    return;
  }
  closePop(); renderWalls();
}

function confirmPop() {
  const p = R.pop;
  if (!p) return;
  const f = R.byKey[p.key];
  readValues(f, p.cond);
  if ($("popN")) p.cond.param = {n: Number($("popN").value)};
  const g = groupOf(p.area, p.exit);
  const i = g.conditions.findIndex((c) => c.field === p.key);
  if (i >= 0) g.conditions[i] = p.cond; else g.conditions.push(p.cond);
  closePop();
  renderWalls();
  changed(p.area !== "exit");
}

document.addEventListener("mousedown", (ev) => {
  if (!R.pop || ev.target.closest("#rulePop") || ev.target.closest("[data-tile]")) return;
  closePop(); renderWalls();
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && R.pop) { closePop(); renderWalls(); } });
window.addEventListener("resize", placePop);

// ---- 体检 / 试跑 / 保存 ----
function kick(affectsPreview) {
  R.checking = true;
  R.vSeq++;
  clearTimeout(R.vTimer);
  R.vTimer = setTimeout(runCheck, 500);
  if (affectsPreview) {
    R.pSeq++;
    clearTimeout(R.pTimer);
    R.pTimer = setTimeout(runPreview, 800);
  }
  renderAside();
}
function changed(affectsPreview) {
  R.notice = null; R.confirmDisable = false;
  kick(affectsPreview);
}

async function runCheck() {
  if (!R.draft) return;
  const seq = ++R.vSeq;
  let res;
  try { res = await api.rule_validate(specOut()); } catch (e) { res = {ok: false, errors: [String(e)]}; }
  if (seq !== R.vSeq || !R.draft) return;
  R.checking = false;
  if (res && res.ok) { R.errors = res.errors || []; R.warnings = res.warnings || []; }
  else { R.errors = [`体检失败：${errText(res, "未知错误")}`]; R.warnings = []; }
  renderAside();
}

async function runPreview() {
  if (!R.draft) return;
  const seq = ++R.pSeq;
  if (!R.draft.select.conditions.length) {
    R.preview = null; R.previewErr = ""; R.previewing = false; renderAside(); return;
  }
  R.previewing = true; renderAside();
  let res;
  try { res = await api.rule_preview(specOut()); } catch (e) { res = {ok: false, errors: [String(e)]}; }
  if (seq !== R.pSeq || !R.draft) return;
  R.previewing = false;
  if (res && res.ok) { R.preview = {total: res.total, rows: res.rows || []}; R.previewErr = ""; }
  else { R.preview = null; R.previewErr = errText(res, "试跑失败"); }
  renderAside();
}

function previewTableHtml() {
  if (R.previewing && !R.preview) return '<div class="tag">试跑中…（第一次要拉全市场行情，稍等几秒）</div>';
  if (!R.preview) return "";
  const rows = R.preview.rows;
  if (!rows.length) return '<div class="empty">当前行情下没有命中</div>';
  const keys = Object.keys(rows[0].values || {});
  // 侧栏窄：股票合成一列并固定在左边，指标表头允许换行，横向滚动时始终看得到是哪只票
  const head = ["#", "股票", ...keys.map((k) => esc(k).replace(/\(N=(\d+)\)/, "<br>N=$1"))];
  return `<div class="preview">${table(head,
    rows.map((r) => [esc(r.rank), `${esc(r.name)}<br><span class="tag">${esc(r.code)}</span>`,
      ...keys.map((k) => esc((r.values || {})[k]))]), [])}</div>`;
}

function renderAside() {
  const el = $("ruleAside");
  if (!el || !R.draft) return;
  const list = (xs) => `<ul>${xs.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
  const check = R.checking ? '<div class="chk-box pending">体检中…</div>'
    : (R.errors.length ? `<div class="chk-box err"><b>错误 ${R.errors.length} 条（改完才能保存）</b>${list(R.errors)}</div>`
      : `<div class="chk-box ok">${ic("check")} 体检通过</div>`) +
      (R.warnings.length ? `<div class="chk-box warn"><b>提醒</b>${list(R.warnings)}</div>` : "");
  const noSelect = !R.draft.select.conditions.length;
  const hit = noSelect ? '<span class="tag">先在「选股」墙上选指标</span>'
    : R.previewing ? '<span class="tag">计算命中数…</span>'
    : R.previewErr ? `<span class="err-text">${esc(R.previewErr)}</span>`
    : R.preview ? `命中 <b class="big-num">${esc(R.preview.total)}</b> 只` +
      (R.preview.total > R.preview.rows.length ? `<div class="tag">下表只列排序后的前 ${esc(R.preview.rows.length)} 只${R.draft.rank && R.draft.rank.field ? "" : "（未设排序，顺序不代表优先级）"}</div>` : "")
    : '<span class="tag">—</span>';
  const saveDisabled = R.checking || R.errors.length > 0 || R.saving;
  el.innerHTML = `<div class="aside-card"><h4>体检</h4>${check}</div>
    <div class="aside-card"><h4>试跑 <span class="tag">当前行情 · 不调用 Jev、不下单</span></h4>
      <div class="hit">${hit}</div>
      <button type="button" id="btnPreview"${noSelect ? " disabled" : ""}>${R.showTable ? "重新试跑" : "试跑（看前 20 只）"}</button>
      ${R.showTable && !noSelect ? previewTableHtml() : ""}</div>
    <div class="aside-card"><button type="button" id="btnSaveRule" class="primary wide"${saveDisabled ? " disabled" : ""}>${R.saving ? "保存中…" : "保存（明日生效）"}</button>
      ${R.notice ? `<div class="notice ${R.notice.ok ? "ok" : "err"}">${esc(R.notice.text)}</div>` : ""}
      <div class="tag" style="margin-top:6px">新版本从下一个交易日开始生效，今天仍按旧版本运行。</div></div>`;
  $("btnPreview").onclick = () => { R.showTable = true; clearTimeout(R.pTimer); runPreview(); };
  $("btnSaveRule").onclick = saveRule;
}

async function saveRule() {
  if (R.saving || !R.draft) return;
  R.saving = true; renderAside();
  const spec = specOut();
  let res;
  try { res = R.sid ? await api.rule_update(R.sid, spec) : await api.rule_create(spec); }
  catch (e) { res = {ok: false, errors: [String(e)]}; }
  R.saving = false;
  if (!res || !res.ok) {
    R.notice = {ok: false, text: `保存失败：${errText(res, "未知错误")}`};
    renderAside();
    return;
  }
  const sid = res.id || R.sid;
  await loadRules();
  const r = R.rules.find((x) => x.id === sid);
  R.sel = {kind: "custom", id: sid}; R.sid = sid;
  if (r) R.draft = normalizeSpec(r.spec);
  R.history = null; R.confirmDisable = false;
  R.notice = {ok: true, text: `已保存 ${sid} v${res.version}，${r ? r.active_from : "下一个交易日"} 起生效`};
  renderRuleList();
  renderRuleMain();
}

function copyRule() {
  if (!R.draft) return;
  const name = R.draft.name;
  R.sid = null; R.sel = {kind: "new", id: ""};
  R.draft.name = `${name}·副本`.slice(0, 20);
  R.history = null; R.confirmDisable = false;
  renderRuleList();
  renderRuleMain();
  kick(true);
  R.notice = {ok: true, text: "已复制为新策略（还没保存），资金可以改"};
  renderAside();
}

async function toggleHistory() {
  if (R.history) { R.history = null; renderHead(); renderHistory(); return; }
  let res;
  try { res = await api.rule_detail(R.sid); } catch (e) { res = {ok: false, errors: [String(e)]}; }
  R.history = res && res.ok ? (res.history || []) : {error: errText(res, "读取失败")};
  renderHead();
  renderHistory();
}

function renderHistory() {
  const el = $("ruleHistory");
  if (!el) return;
  if (!R.history) { el.innerHTML = ""; return; }
  if (R.history.error) { el.innerHTML = `<div class="err-text history">版本历史读取失败：${esc(R.history.error)}</div>`; return; }
  const rows = R.history.slice().reverse();
  el.innerHTML = `<div class="history">${table(["版本", "名称", "保存日", "生效日", "状态", ""], rows.map((h) => [
    `v${esc(h.version)}`, esc(h.name), esc(h.created), esc(h.active_from), h.enabled ? "启用" : "停用",
    `<button type="button" data-load-ver="${esc(h.version)}">载入编辑</button>`]), [])}</div>`;
  el.querySelectorAll("[data-load-ver]").forEach((b) => b.onclick = () => {
    const h = R.history.find((x) => String(x.version) === b.dataset.loadVer);
    if (!h) return;
    closePop();
    R.draft = normalizeSpec(h.spec);
    R.open = R.draft.exits.map(() => false);
    const keep = R.history;
    renderRuleMain();
    R.history = keep; renderHead(); renderHistory();
    kick(true);
    R.notice = {ok: true, text: `已载入 v${h.version}，保存后成为新版本`};
    renderAside();
  });
}

async function disableRule() {
  if (!R.confirmDisable) { R.confirmDisable = true; renderHead(); return; }
  R.confirmDisable = false;
  let res;
  try { res = await api.rule_disable(R.sid); } catch (e) { res = {ok: false, errors: [String(e)]}; }
  await loadRules();
  renderRuleList();
  renderHead();
  R.notice = res && res.ok
    ? {ok: true, text: "已停用：下一个交易日起不再开新仓，已有持仓按原卖出规则处理完"}
    : {ok: false, text: `停用失败：${errText(res, "未知错误")}`};
  renderAside();
}

// ======================= 知识库：专题手册 + 文章索引（只读，内容在 jevq/app/knowledge.json） =======================
// K.view 是专题 id 或 "index"；搜索词非空时右侧改成全库搜索结果。标题、要点、搜索词一律经 esc()。
const K = {data: null, error: "", view: "", q: "", filter: "", open: null};
const KB_UNSORTED = "none";         // 文章索引里「未归类」的筛选值
const kbTerms = (q) => String(q || "").toLowerCase().split(/\s+/).filter(Boolean);
const kbHit = (text, terms) => { const t = String(text).toLowerCase(); return terms.every((w) => t.includes(w)); };
const kbNewest = (a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id);

function kbMark(text, terms) {      // 先按搜索词切开原文再逐段转义，命中的段落包进 <mark>
  if (!terms.length) return esc(text);
  const re = new RegExp(`(${terms.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})`, "gi");
  return String(text).split(re).map((part, i) => (i % 2 ? `<mark>${esc(part)}</mark>` : esc(part))).join("");
}

function kbRefs(data, ids) {
  return `<span class="kb-refs">${ids.map((id, i) => {
    const a = data.articles.find((x) => x.id === id);
    return a ? `<button type="button" class="kb-ref" data-kb-article="${esc(id)}" title="${esc(a.title)}">${i + 1}</button>` : "";
  }).join("")}</span>`;
}

function kbArticleHtml(data, a, terms, open) {
  const topic = data.topics.find((t) => t.id === a.topic);
  const tags = (topic ? `<span class="badge">${esc(topic.name)}</span>` : "")
    + (a.deleted ? '<span class="badge off">原文已删</span>' : "") + (a.dup ? '<span class="badge off">重复</span>' : "");
  let body;
  if (a.deleted) {
    body = '<p class="tag">原文已经被作者或平台删除，只留下标题。</p>';
  } else if (a.dup) {
    const same = data.articles.find((x) => x.id === a.dup);
    body = `<p class="tag">和另一篇内容相同：<button type="button" class="kb-link" data-kb-article="${esc(a.dup)}">${esc(same ? same.title : "")}</button></p>`;
  } else {
    body = `<ul>${a.points.map((p) => `<li>${kbMark(p, terms)}</li>`).join("")}</ul>`;
  }
  return `<details class="kb-art" id="kb-a-${esc(a.id)}"${open ? " open" : ""}>
    <summary>${ic("chev-right")}<span class="kb-date">${esc(a.date)}</span><span class="kb-title">${kbMark(a.title, terms)}</span>${tags}</summary>
    <div class="kb-art-body builtin-sec">${body}<a class="kb-src" href="${esc(a.url)}" target="_blank" rel="noopener">${ic("link")}看原文</a></div></details>`;
}

function kbTopicHtml(data, t) {
  return `<div class="kb-read"><h3>${esc(t.name)}</h3><p class="kb-intro">${esc(t.intro)}</p>
    <p class="tag">每条后面的数字是出处，点一下看那篇文章的摘要和原文链接。</p>
    ${t.sections.map((s) => `<div class="builtin-sec"><h4>${esc(s.title)}</h4><ul>${s.points.map((p) =>
      `<li>${esc(p.text)}${kbRefs(data, p.refs)}</li>`).join("")}</ul></div>`).join("")}</div>`;
}

function kbIndexHtml(data, s) {
  const filters = [["", "全部"], ...data.topics.map((t) => [t.id, t.name]), [KB_UNSORTED, "未归类"]];
  const list = data.articles.filter((a) => !s.filter || (s.filter === KB_UNSORTED ? !a.topic : a.topic === s.filter)).sort(kbNewest);
  return `<div class="tabs">${filters.map(([v, label]) =>
      `<button type="button" data-kb-filter="${esc(v)}" class="${(s.filter || "") === v ? "active" : ""}">${esc(label)}</button>`).join("")}</div>
    <p class="tag kb-count">${list.length} 篇，新的在前。点标题看摘要。</p>
    ${list.map((a) => kbArticleHtml(data, a, [], a.id === s.open)).join("")}`;
}

function kbSearchHtml(data, terms) {
  const groups = data.topics.map((t) => [t, t.sections.flatMap((s) => s.points).filter((p) => kbHit(p.text, terms))])
    .filter(([, pts]) => pts.length);
  const arts = data.articles.filter((a) => kbHit([a.title, ...a.points].join("\n"), terms)).sort(kbNewest);
  const nPts = groups.reduce((n, [, pts]) => n + pts.length, 0);
  if (!nPts && !arts.length) return '<div class="empty">没有找到，换个词试试</div>';
  return `<div class="kb-read"><p class="tag">手册要点 ${nPts} 条，文章 ${arts.length} 篇</p>
    ${groups.map(([t, pts]) => `<div class="builtin-sec"><h4>${esc(t.name)}</h4><ul>${pts.map((p) =>
      `<li>${kbMark(p.text, terms)}${kbRefs(data, p.refs)}</li>`).join("")}</ul></div>`).join("")}</div>
    ${arts.length ? `<div class="builtin-sec"><h4>文章</h4></div>` : ""}
    ${arts.map((a) => kbArticleHtml(data, a, terms, arts.length <= 20)).join("")}`;
}

function kbNavHtml(data, s) {
  const searching = kbTerms(s.q).length > 0;
  const btn = (v, label, n) => `<button type="button" data-kb-view="${esc(v)}" class="${!searching && s.view === v ? "on" : ""}">${esc(label)}<span class="kb-n">${n}</span></button>`;
  return `<div class="kb-nav-title">专题手册</div>${data.topics.map((t) =>
      btn(t.id, t.name, t.sections.reduce((n, sec) => n + sec.points.length, 0))).join("")}
    <div class="kb-nav-title">原文</div>${btn("index", "文章索引", data.articles.length)}`;
}

function kbMainHtml(data, s) {
  const terms = kbTerms(s.q);
  if (terms.length) return kbSearchHtml(data, terms);
  if (s.view === "index") return kbIndexHtml(data, s);
  return kbTopicHtml(data, data.topics.find((t) => t.id === s.view) || data.topics[0]);
}

function kbRender() {
  $("kbNav").innerHTML = kbNavHtml(K.data, K);
  $("kbMain").innerHTML = kbMainHtml(K.data, K);
}

function kbOpenArticle(id) {        // 从出处数字跳到文章索引里的那一篇并展开
  K.view = "index"; K.q = ""; K.filter = ""; K.open = id;
  $("kbSearch").value = "";
  kbRender();
  const el = $("kb-a-" + id);
  if (el) el.scrollIntoView({block: "center"});
}

async function renderKnowledgeTab(body) {
  if (!K.data) {
    try { K.data = await api.knowledge(); K.error = ""; } catch (e) { K.error = String(e); }
    if (tab !== "knowledge") return;
  }
  if (!K.data) { body.innerHTML = `<div class="empty err-text">知识库加载失败：${esc(K.error)}。重开面板再试</div>`; return; }
  if (!K.view) K.view = K.data.topics[0].id;
  const src = K.data.source;
  body.innerHTML = `<div class="kb-head">
      <label class="kb-search">${ic("search")}<input id="kbSearch" type="search" aria-label="搜索知识库" placeholder="搜要点和文章，空格隔开多个词" autocomplete="off"></label>
      <span class="tag">整理自 <a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.name)}</a> 的 ${K.data.articles.length} 篇文章，截至 ${esc(src.fetched)}。是别人的经验，没有接进交易规则。</span>
    </div>
    <div class="layout kb-layout"><div class="report-list" id="kbNav"></div><div id="kbMain"></div></div>`;
  const search = $("kbSearch");
  search.value = K.q;
  search.oninput = () => { K.q = search.value; kbRender(); };
  $("kbNav").onclick = (ev) => {
    const b = ev.target.closest("[data-kb-view]");
    if (!b) return;
    K.view = b.dataset.kbView; K.q = ""; K.open = null; search.value = "";
    kbRender();
  };
  $("kbMain").onclick = (ev) => {
    const ref = ev.target.closest("[data-kb-article]");
    if (ref) { kbOpenArticle(Number(ref.dataset.kbArticle)); return; }
    const f = ev.target.closest("[data-kb-filter]");
    if (f) { K.filter = f.dataset.kbFilter; K.open = null; kbRender(); }
  };
  kbRender();
}

async function refresh() {
  const s = await api.status();
  today = s.today;
  accountMeta = Object.fromEntries((s.accounts || []).map((a) => [a.id,
    {name: a.name, baseline: a.baseline ?? 30000, strategy: a.strategy, strategyName: a.strategy_name}]));
  $("dot").className = "dot" + (s.running || s.background ? " on" : "");
  $("phase").textContent = s.running ? s.phase : (s.background ? "后台任务运行中" : "未运行");
  $("overseas").textContent = s.overseas || "–";
  $("sentiment").textContent = s.sentiment || "–";
  $("warningWrap").style.display = s.warning ? "" : "none";
  $("warning").innerHTML = esc(s.warning);
  $("watchWrap").style.display = s.board_watch && s.board_watch.length ? "" : "none";
  $("boardWatch").innerHTML = (s.board_watch || []).map((w) => esc(w.name || w.code)).join("、");
  $("daemonWrap").style.display = s.daemon ? "" : "none";
  $("daemonMsg").innerHTML = esc(s.daemon ? "后台程序已接管今日交易，面板只需查看" : "");
  $("btnStart").disabled = s.running || s.background || s.daemon;
  $("btnStop").disabled = !s.running;
  renderAccounts(s.accounts || []);
  renderCurve(await api.equity_curve());
  if (tab !== "reports" && tab !== "rules" && tab !== "knowledge" && tab !== "own" && tab !== "mood") await renderTab();   // 规则页是编辑器，定时刷新会冲掉正在编辑的内容；知识库有搜索框和展开状态
}

window.addEventListener("pywebviewready", async () => {
  api = window.pywebview.api;
  $("btnStart").onclick = async () => { await api.start(); refresh(); };
  $("btnStop").onclick = async () => { await api.stop(); refresh(); };
  document.querySelectorAll("#mainTabs button").forEach((b) => b.onclick = () => {
    document.querySelectorAll("#mainTabs button").forEach((x) => x.classList.toggle("active", x === b));
    closePop();
    tab = b.dataset.tab; selectedId = null; noticesExpanded = false; renderTab();
  });
  await loadRules();          // 策略名给图例、决策筛选、命中条件标题用
  await refresh();
  await renderTab();
  setInterval(refresh, 5000);
});
</script>
